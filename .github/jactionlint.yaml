# jactionlint's settings for test.yml's lint-workflows job. The format is
# described in https://jactionlint.jdx.dev/config.

# The correctness profile: actionlint's checks, shellcheck over every run:
# block, and jactionlint's own bug detectors. Written out so that a change
# of jactionlint's default profile is a change here.
profile: correctness

# The labels of the runners that are not GitHub-hosted. jactionlint reports
# any other label in runs-on as unknown. Today the workflows name these
# through expressions, which jactionlint does not evaluate, so this is for
# the next workflow that names one directly.
#   omarchy-builder: the DigitalOcean droplet pool that ci/controller.sh runs
#   namespace-profile-arm64-linux-apple-12x32: Namespace's Apple-backed
#     runner for aarch64 kernels (package_runner in helpers/package-metadata.sh)
self-hosted-runner:
  labels:
    - omarchy-builder
    - namespace-profile-arm64-linux-apple-12x32
