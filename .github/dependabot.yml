# Keeps the pinned actions and the builder image's base current. Every
# action is pinned by commit with its version in a comment, and Dependabot
# updates both. A release waits 7 days before it is proposed, so a bad or
# compromised release has time to be noticed and withdrawn upstream first.
# These PRs touch .github/ and build/, never pkgbuilds/ alone, so none of them
# merges itself: a maintainer reviews and merges each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # build/Dockerfile's bootstrap stage (alpine). The Arch images are rolling
  # tags with nothing to bump.
  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
