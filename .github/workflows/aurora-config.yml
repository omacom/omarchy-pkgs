name: Aurora kernel configuration

on:
  pull_request:
    paths:
      - pkgbuilds/linux-aurora/**
      - tests/aurora-edge/configure.py
      - .github/workflows/aurora-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      LLVM: /usr/lib/llvm-18/bin/
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout base package configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: baseline
          sparse-checkout: pkgbuilds/linux-aurora
          persist-credentials: false
      - name: Read immutable source and Rust pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          package = pathlib.Path('pkgbuilds/linux-aurora')
          match = re.search(r'^_commit=([0-9a-f]{40})$', (package / 'PKGBUILD').read_text(), re.M)
          if not match:
              raise SystemExit('Expected a full kernel commit pin')
          rust = tomllib.loads((package / 'rust-toolchain.toml').read_text())['toolchain']['channel']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', rust):
              raise SystemExit('Expected an exact Rust version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'kernel={match[1]}\nrust={rust}', file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: omacom/linux-aurora
          ref: ${{ steps.pins.outputs.kernel }}
          path: kernel
          persist-credentials: false
      - name: Install configuration tools
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev \
            clang-18 llvm-18 lld-18 libclang-18-dev pkg-config
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-src
          # Only Kconfig's availability probe runs bindgen; no driver bindings
          # or kernel objects are generated by this job.
          cargo +"$RUST_VERSION" install --locked bindgen-cli --version 0.71.1 \
            --root "$RUNNER_TEMP/aurora-config-tools"
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "BINDGEN=$RUNNER_TEMP/aurora-config-tools/bin/bindgen" >> "$GITHUB_ENV"
      - name: Describe toolchain scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This is an approximate configuration check using Ubuntu LLVM 18 and
          stock bindgen 0.71.1 for Kconfig's availability probes. Package builds
          use ALARM llvm18 and private bindgen 0.73.2 through bindgen-kernel.py.
          Both checks share configure.sh; this job does not replace prepare()
          or the full package build. Baseline and candidate use the same kernel
          and tools so config.diff isolates package configuration changes.
          EOF
      - name: Resolve and validate shared and Neo capabilities
        run: |
          if [[ ! -f baseline/pkgbuilds/linux-aurora/common.config ]]; then
            # Fetch the base package's kernel-owned fragment at its immutable
            # pin, rather than accidentally comparing the candidate to itself.
            python3 - <<'PY'
          import pathlib, re, urllib.request
          package = pathlib.Path('baseline/pkgbuilds/linux-aurora')
          match = re.search(r'^_commit=([0-9a-f]{40})$', (package / 'PKGBUILD').read_text(), re.M)
          if not match:
              raise SystemExit('Expected a full baseline kernel commit pin')
          url = f'https://raw.githubusercontent.com/omacom/linux-aurora/{match[1]}/arch/arm64/configs/asahi.config'
          with urllib.request.urlopen(url, timeout=60) as response:
              (package / 'kernel-asahi.config').write_bytes(response.read())
          PY
          fi
          python3 tests/aurora-edge/configure.py --kernel "$PWD/kernel" \
            --baseline "$PWD/baseline/pkgbuilds/linux-aurora" \
            --output "$RUNNER_TEMP/aurora-config-report"
      - name: Upload resolved configuration and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-config-${{ github.sha }}
          path: ${{ runner.temp }}/aurora-config-report/
          if-no-files-found: ignore
          retention-days: 14
