name: Approve PR workflows

# A pull_request workflow cannot approve itself: GitHub can hold it before
# any job starts. This workflow only runs trusted default-branch code and
# releases the ordinary, unprivileged PR workflows after build approval.
# When a PR from an author who is not a collaborator, bot, or vouched
# receives new commits or is reopened, build-approved is cleared. Aligning
# build-pr.yml's gate for non-held synchronize/reopened runs is tracked separately.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  reset:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'build-approved') &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: reset-build-approved-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Never check out the PR head or its merge ref with write permissions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reset build-approved for non-trusted authors
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = require('fs');
            const { authorStatus } = require('./.github/scripts/auto-merge-pr.cjs');
            const { resetBuildApproval } = require('./.github/scripts/approve-pr-workflows.cjs');
            const vouchStatus = await authorStatus({
              github, context, login: context.payload.pull_request.user.login,
              vouched: readFileSync('.github/VOUCHED.td', 'utf8'),
            });
            await resetBuildApproval({ github, context, core, vouchStatus });

  approve:
    # Match build-pr.yml's events, including other labels applied while this
    # PR still carries build-approved: each labeled event creates a build.
    if: contains(github.event.pull_request.labels.*.name, 'build-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: approve-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Never check out the PR head or its merge ref with this write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Approve this PR's pending build and test runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = require('fs');
            const { authorStatus } = require('./.github/scripts/auto-merge-pr.cjs');
            const approve = require('./.github/scripts/approve-pr-workflows.cjs');
            const vouchStatus = await authorStatus({
              github, context, login: context.payload.pull_request.user.login,
              vouched: readFileSync('.github/VOUCHED.td', 'utf8'),
            });
            await approve({ github, context, core, vouchStatus });
