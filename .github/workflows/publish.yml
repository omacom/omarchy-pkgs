name: Publish merged packages

# On every push to master: for each package directory the push touched and
# each architecture it supports, find the PR build artifact for exactly that
# tree (label = <pkg>-<arch>-<treehash>), or build it now when there is
# none, then publish that one artifact into every channel the package ships
# to. One build, one file, several databases: a filename means one set of
# bytes everywhere, and channels are views over a shared pool.
#
# Secrets live in the "publish" environment, restricted to master:
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE   the channel signing key
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT
#   MAC_INSTALLER_DISPATCH_TOKEN (optional) fine-grained token for
#     omacom/omarchy-mac-installer only, Contents: read and write; lets
#     an edge aarch64 publish start that repo's Mac image check
# OMARCHY_PUBLISH_PREFIX (environment variable, not secret) points a proof
# run at a scratch prefix inside the live bucket; empty means the real
# channel paths.

on:
  push:
    branches: [master]
    paths: ["pkgbuilds/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package directories to publish from master"
        required: true

# Only the publish job serializes (see its concurrency group): two publishes
# into one channel at once would race on the database. Builds run outside the
# lock, so a merge waits behind another merge's signing and upload, seconds,
# never behind its kernel build.

jobs:
  # The plan: which packages and architectures the push touched, the pkgbase
  # each one builds, and whether its build can be reused, must be rebuilt, or
  # is already published. The publish job gets that as data (the matrix,
  # with a decision on every entry) and works from it alone.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      rebuild: ${{ steps.list.outputs.rebuild }}
      rebuild_count: ${{ steps.list.outputs.rebuild_count }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ github.event.inputs.packages }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n $PACKAGES ]]; then
            names=$PACKAGES
          else
            names=$(git diff --name-only "$BEFORE..$GITHUB_SHA" -- pkgbuilds \
              | awk -F/ '$1=="pkgbuilds" && NF>2 {print $2}' | sort -u)
          fi
          matrix=$(printf '%s\n' $names | bin/build-matrix)
          jq -r '.include[] | "\(.package) \(.arch) -> \(.channels)"' <<<"$matrix"
          # Reuse or rebuild, decided per entry and said out loud. A tree with
          # no build artifact (PR artifacts last 7 days; a dispatch may name
          # any package) goes to the rebuild job, on the runner build-matrix
          # names for it: the one its PR build would have had.
          rebuild=() planned=()
          echo "| package | arch | tree | decision |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          while read -r entry; do
            package=$(jq -r .package <<<"$entry"); arch=$(jq -r .arch <<<"$entry")
            hash=$(git rev-parse "HEAD:pkgbuilds/$package")
            label="$package-$arch-$hash"
            # Only an artifact from a run that may supply it (bin/build-artifact).
            found=$(bin/build-artifact "$package" "$arch")
            # A tree the channel already holds at master's version (a re-run,
            # or a dispatch naming a package that is fine) needs no build, and
            # an x86 rebuild would wait minutes for a droplet to find that out
            # in seconds.
            plan=""
            [[ -n "$found" ]] || plan=$(bin/build --dry-run --mirror edge --arch "$arch" --package "$package" 2>&1 | grep -E '^==> Plan complete' || true)
            if [[ -n "$found" ]]; then
              decision=reuse
              said="reuse the build artifact (run ${found##* })"
            elif [[ -n "$plan" && -z "$(sed -E 's/.*would build: *//' <<<"$plan" | tr -d '[:space:]')" ]]; then
              decision=published
              said="already published at master's version, nothing to build"
            else
              decision=rebuild
              said="no build artifact: rebuild on $(jq -r '.runner | fromjson | join(", ")' <<<"$entry")"
              rebuild+=("$entry")
            fi
            planned+=("$(jq -c --arg d "$decision" '. + {decision: $d}' <<<"$entry")")
            echo "==> $label: $said"
            echo "| $package | $arch | ${hash:0:12} | $said |" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.include[]' <<<"$matrix")
          echo "matrix=$(printf '%s\n' "${planned[@]}" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "count=${#planned[@]}" >> "$GITHUB_OUTPUT"
          echo "rebuild=$(printf '%s\n' "${rebuild[@]}" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "rebuild_count=${#rebuild[@]}" >> "$GITHUB_OUTPUT"
      # The recipe index (bin/recipe-index) for the publish job: the fast
      # ring's promotion and the Mac package-set check read it.
      - name: Index the recipes
        run: |
          set -euo pipefail
          bin/recipe-index > recipe-index.tsv
          echo "$(wc -l < recipe-index.tsv) recipe index lines"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: recipe-index
          path: recipe-index.tsv
          if-no-files-found: error
          retention-days: 7

  # "Build it now when there is none". Each entry builds exactly as
  # build-pr.yml builds it (same runner kind, same builder image, same
  # bin/build call) and uploads under the same label, so the publish job
  # collects this run's artifact the way it collects a PR's. No secret
  # reaches these runners, and they hold no lock: entries build in parallel,
  # and other merges publish while they do.
  rebuild:
    needs: changes
    if: needs.changes.outputs.rebuild_count != '0'
    runs-on: ${{ fromJSON(matrix.runner) }}
    # The droplets are x86, so aarch64 never builds there. omarchy-mac-boot
    # under QEMU took 2h47m; native arm64 and x86 kernels fit easily.
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.rebuild) }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      # The same check the publish job makes before building: a re-run for a
      # package the channel already holds at master's version builds
      # nothing, and uploads nothing that could shadow the published file.
      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        id: build
        env:
          CONTAINER_ENGINE: docker
          PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "label=$PACKAGE-$ARCH-$(git rev-parse "HEAD:pkgbuilds/$PACKAGE")" >> "$GITHUB_OUTPUT"
          plan=$(bin/build --dry-run --mirror edge --arch "$ARCH" --package "$PACKAGE" 2>&1 | grep -E '^==> Plan complete' || true)
          if [[ -n "$plan" && -z "$(sed -E 's/.*would build: *//' <<<"$plan" | tr -d '[:space:]')" ]]; then
            echo "==> $PACKAGE ($ARCH): already published at master's version, nothing to build"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bin/build --mirror edge --arch "$ARCH" --package "$PACKAGE"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Pack artifact
        if: steps.build.outputs.built == 'true'
        id: pack
        env:
          PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: |
          source helpers/artifact-helpers.sh
          pack_packages "build-output/edge/$ARCH" packages.tar
          tar -tvf packages.tar
      - name: Upload artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.build.outputs.label }}
          path: packages.tar
          if-no-files-found: error
          retention-days: 7
      # The channel already serves this tree's version (another run published
      # it after the changes job planned): say so to the publish job, which
      # skips the package instead of waiting for an artifact.
      - name: Record that it is already published
        if: steps.build.outputs.built == 'false'
        run: echo "${{ github.run_id }}" > published
      - name: Upload the record
        if: steps.build.outputs.built == 'false'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: published-${{ steps.build.outputs.label }}
          path: published
          if-no-files-found: error
          retention-days: 7

  # One job for the whole merge. It collects every artifact for the merged
  # tree (PR builds, or the rebuild job above), then walks each channel and
  # architecture slot exactly once: pull that database, add every package
  # that belongs in it, upload. Six slots, six round trips, however many
  # packages the merge carried. One process is the only writer, so there
  # is no race between packages; the concurrency group keeps one merge's
  # publish from overlapping the next. It builds nothing, so it runs on a
  # hosted runner in about a minute instead of waiting for a droplet.
  # It waits for the rebuild job and runs whatever that job's result: a
  # failed rebuild leaves its package without an artifact, and the collect
  # step below records that and stops before any publish.
  publish:
    needs: [changes, rebuild]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 30
    # queue: max, because by default a group holds one waiting job: a third
    # merge arriving cancels the second one's publish, and nothing reruns it.
    # With it up to 100 wait, in the order they reach this job.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # This run's recipe index, from the changes job.
      - uses: actions/download-artifact@v4.3.0
        with:
          name: recipe-index
          path: ${{ runner.temp }}/recipe-index

      # What this job publishes comes from the changes job's matrix, checked
      # field by field (bin/publish-plan), and from the built files. Every
      # entry, as a file the shell steps can loop over:
      # package arch channels publish_arches pkgbase decision
      # plan.json keeps the same entries for the publish record.
      - name: Plan
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          bin/publish-plan <<<"$MATRIX" > plan.txt
          jq -c '.include' <<<"$MATRIX" > plan.json
          cat plan.txt

      # Fetch each package's artifact into build-output/edge/<arch>/: the PR's,
      # or the rebuild job's when the PR's had expired. An artifact
      # carries its package files inside packages.tar (see build-pr.yml and
      # helpers/artifact-helpers.sh: the upload action rejects the colon in
      # an epoch filename).
      - name: Collect artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER_ENGINE: docker
        run: |
          set -uo pipefail
          source helpers/artifact-helpers.sh
          # sources.jsonl: where each package's files came from, or that the
          # build failed. A failed build ends the run before any publish, and
          # the record says so instead of the report job finding nothing.
          : > sources.jsonl
          failed=0
          while read -r package arch _ _ _ decision; do
            hash=$(git rev-parse "HEAD:pkgbuilds/$package")
            label="$package-$arch-$hash"
            # The changes job found the channel already serving this tree's
            # version: a re-run, or a dispatch naming a package that is fine.
            if [[ $decision == "published" ]]; then
              echo "==> $label: already published at master's version, nothing to do"
              jq -nc --arg p "$package" --arg a "$arch" '{package:$p, arch:$a, source:"already-published"}' >> sources.jsonl
              continue
            fi
            # Decided again here rather than taken from the plan: which run
            # supplies the bytes this job signs is this job's call.
            found=$(bin/build-artifact "$package" "$arch")
            read -r found from_run <<<"$found" || true
            mkdir -p "build-output/edge/$arch"
            if [[ -n "$found" ]]; then
              if [[ $from_run == "$GITHUB_RUN_ID" ]]; then
                kind=rebuild
                echo "==> $label: artifact from this run's $arch rebuild"
              else
                kind=pr-artifact
                echo "==> $label: reusing the build artifact from run $from_run"
              fi
              rm -rf /tmp/artifact; mkdir -p /tmp/artifact
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/artifact.zip "$found" \
                && unzip -oq /tmp/artifact.zip -d /tmp/artifact \
                && unpack_packages /tmp/artifact "build-output/edge/$arch"; then
                jq -nc --arg p "$package" --arg a "$arch" --arg s "$kind" '{package:$p, arch:$a, source:$s}' >> sources.jsonl
              else
                jq -nc --arg p "$package" --arg a "$arch" '{package:$p, arch:$a, source:"artifact-download-failed"}' >> sources.jsonl; failed=1; break
              fi
            elif gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' \
              | grep -qxF "published-$label"; then
              # This run's rebuild found the channel already serving this
              # tree's version: another run published it after planning.
              echo "==> $label: already published at master's version, nothing to do"
              jq -nc --arg p "$package" --arg a "$arch" '{package:$p, arch:$a, source:"already-published"}' >> sources.jsonl
            else
              # Nothing builds here. No artifact means the rebuild failed (see
              # the rebuild job), or an artifact expired between planning and
              # now (re-run all jobs).
              echo "::error::$label: no artifact from the rebuild job"
              jq -nc --arg p "$package" --arg a "$arch" '{package:$p, arch:$a, source:"build-failed"}' >> sources.jsonl; failed=1; break
            fi
          done < plan.txt
          ls -1 build-output/edge/*/*.pkg.tar.zst 2>/dev/null || true
          if (( failed )); then
            # Write the record now; the publish step will not run.
            jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg prefix "${OMARCHY_PUBLISH_PREFIX:-}" --arg event "$GITHUB_EVENT_NAME" \
              --slurpfile sources sources.jsonl --slurpfile plan plan.json \
              '{time: (now|todate), commit:$sha, run:$run, event:$event, target: (if $prefix=="" then "live" else $prefix end), plan:$plan[0], sources:$sources, slots:[]}' \
              > publish-record.json
            cat publish-record.json
            exit 1
          fi

      - name: Publish
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          # The token is scoped to the bucket; it may not CreateBucket, and
          # rclone's existence check is a CreateBucket in disguise.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OMARCHY_PUBLISH_PREFIX: ${{ vars.OMARCHY_PUBLISH_PREFIX }}
        # repo-add, gpg and bsdtar are Arch tools; run the publish inside the
        # publisher image (ci/publisher.Dockerfile: Arch packages only) with
        # the workspace mounted.
        run: |
          set -euo pipefail
          if ! compgen -G "build-output/edge/*/*.pkg.tar.zst" >/dev/null; then
            echo "Nothing to publish: every requested package is already published at master's version."
            jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg prefix "${OMARCHY_PUBLISH_PREFIX:-}" --arg event "$GITHUB_EVENT_NAME" \
              --slurpfile sources sources.jsonl --slurpfile plan plan.json \
              '{time: (now|todate), commit:$sha, run:$run, event:$event, target: (if $prefix=="" then "live" else $prefix end), plan:$plan[0], sources:$sources, slots:[]}' \
              > publish-record.json
            cat publish-record.json
            exit 0
          fi
          docker build --quiet -t omarchy-publisher -f ci/publisher.Dockerfile ci

          # Group the merge's files by the (channel, architecture) slot each
          # belongs to. A package's files live under build-output/edge/<built
          # arch>/ and are named <pkgname>-<ver>-<arch|any>.pkg.tar.zst; a
          # split package's outputs share the pkgbase's directory, so match
          # on the artifact list rather than the name.
          # pkgbase is read inside the publisher image: the Ubuntu host has no
          # bsdtar. One container call maps every file to its pkgbase, read
          # as bin/publish-artifact and repo-add read it (helpers/pkginfo.sh).
          docker run --rm -v "$PWD:/w:ro" -w /w omarchy-publisher bash -c '
            set -euo pipefail
            source helpers/pkginfo.sh
            for f in build-output/edge/*/*.pkg.tar.zst; do
              identity=$(pkginfo_identity "$f")
              read -r _ base _ _ <<<"$identity"
              printf "%s %s\n" "$f" "$base"
            done' > pkgbase.txt
          declare -A slot_files=()
          # pkgbase comes with the plan: what the recipe builds, which is not
          # always its directory name (pkgbuilds/yaru-icon-theme builds yaru).
          while read -r package arch channels publish_arches base _; do
            matched=0
            for f in build-output/edge/"$arch"/*.pkg.tar.zst; do
              [[ -e $f ]] || continue
              # Only files this package produced (its PKGINFO pkgbase).
              [[ $(awk -v f="$f" '$1==f{print $2}' pkgbase.txt) == "$base" ]] || continue
              matched=$((matched + 1))
              for mirror in ${channels//,/ }; do
                for parch in ${publish_arches//,/ }; do
                  slot_files["$mirror/$parch"]+="$f "
                done
              done
            done
            # A collected artifact must yield this package's files; publishing
            # none of them would read as success and leave every channel stale.
            if (( matched == 0 )) && jq -e --arg p "$package" --arg a "$arch" \
              'select(.package == $p and .arch == $a and .source != "already-published")' sources.jsonl >/dev/null; then
              echo "::error::$package ($arch): its artifact has no files with pkgbase $base"
              unmatched=1
            fi
          done < plan.txt
          if [[ -n ${unmatched:-} ]]; then
            jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg prefix "${OMARCHY_PUBLISH_PREFIX:-}" --arg event "$GITHUB_EVENT_NAME" \
              --slurpfile sources sources.jsonl --slurpfile plan plan.json \
              '{time: (now|todate), commit:$sha, run:$run, event:$event, target: (if $prefix=="" then "live" else $prefix end), plan:$plan[0], sources:$sources, slots:[]}' \
              > publish-record.json
            exit 1
          fi

          # Deterministic slot order: edge before rc before stable, x86_64
          # before aarch64, so a failure leaves the earlier rings consistent.
          # Every slot's outcome goes into publish-record.json for the report
          # job: what was published, where, from which artifact, and whether
          # the slot succeeded. A failing slot stops the loop (set -e) but the
          # record still shows everything before it landed.
          : > slots.jsonl
          record_slot() { jq -nc --arg m "$1" --arg a "$2" --arg st "$3" --arg files "$4" \
            '{mirror:$m, arch:$a, status:$st, packages:[$files | split(" ") | .[] | select(length>0) | sub(".*/";"") | sub("\\.pkg\\.tar\\.zst$";"")]}' >> slots.jsonl; }
          status=0
          # rc and stable get fast-ring builds here, held to the qualified Mac
          # set like any promotion (bin/check-mac-set). Every one of those
          # slots is checked before any slot publishes, edge included, so a
          # refusal on one architecture leaves every channel as it was.
          : > mac-slots.txt
          for mirror in rc stable; do
            for parch in x86_64 aarch64; do
              files=${slot_files["$mirror/$parch"]:-}
              [[ -z "$files" ]] || echo "$mirror $parch $files" >> mac-slots.txt
            done
          done
          if [[ -s mac-slots.txt ]] && ! docker run --rm \
            -e OMARCHY_PUBLISH_PREFIX \
            -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET \
            -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
            -v "$PWD:/w:ro" -v "$RUNNER_TEMP/recipe-index:/index:ro" -w /w \
            omarchy-publisher \
            bin/check-mac-set --remote R2:omarchy-pkgs --recipe-index /index/recipe-index.tsv --slots mac-slots.txt; then
            echo "::error title=Mac package set::this merge would leave rc or stable without the qualified Mac set; nothing published"
            while read -r mirror parch files; do record_slot "$mirror" "$parch" refused "$files"; done < mac-slots.txt
            status=1
          fi
          (( status == 0 )) && for mirror in edge rc stable; do
            for parch in x86_64 aarch64; do
              files=${slot_files["$mirror/$parch"]:-}
              [[ -n "$files" ]] || continue
              echo "==> $mirror/$parch: $files"
              if docker run --rm \
                -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e OMARCHY_PUBLISH_PREFIX \
                -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET \
                -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
                -v "$PWD:/w:ro" -w /w \
                omarchy-publisher \
                bin/publish-artifact --remote R2:omarchy-pkgs --mirror "$mirror" --arch "$parch" $files; then
                record_slot "$mirror" "$parch" published "$files"
              else
                record_slot "$mirror" "$parch" failed "$files"
                status=1
                break 2
              fi
            done
          done
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg prefix "${OMARCHY_PUBLISH_PREFIX:-}" --arg event "$GITHUB_EVENT_NAME" \
            --slurpfile slots slots.jsonl --slurpfile sources sources.jsonl --slurpfile plan plan.json \
            '{time: (now|todate), commit:$sha, run:$run, event:$event, target: (if $prefix=="" then "live" else $prefix end), plan:$plan[0], sources:$sources, slots:$slots}' \
            > publish-record.json
          cat publish-record.json
          exit $status

      # A merge publishes a fast-ring build to edge, rc and stable at once,
      # but the steps above skip a package edge already holds at master's
      # version: one that just joined the fast ring, or whose rc or stable
      # copy never landed. Copy edge's file to those channels. Nothing to do
      # once they agree, which is every run where the publish above went in.
      - name: Bring the fast ring in line with edge
        if: success()
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OMARCHY_PUBLISH_PREFIX: ${{ vars.OMARCHY_PUBLISH_PREFIX }}
        run: |
          set -euo pipefail
          # The fast-ring pkgbases of this merge, per channel and architecture:
          # a merge publishes to rc and stable only for the fast ring, so the
          # plan's channels say which packages those are.
          declare -A bases=()
          while read -r _ _ channels publish_arches base _; do
            for mirror in rc stable; do
              [[ ",$channels," == *",$mirror,"* ]] || continue
              for parch in ${publish_arches//,/ }; do
                bases["$mirror $parch"]+="$base "
              done
            done
          done < plan.txt
          if (( ${#bases[@]} == 0 )); then
            echo "No fast-ring packages in this merge."
            exit 0
          fi

          # The Publish step skips building the image when it has nothing new.
          docker image inspect omarchy-publisher >/dev/null 2>&1 \
            || docker build --quiet -t omarchy-publisher -f ci/publisher.Dockerfile ci

          mkdir -p "$RUNNER_TEMP/fast-ring"
          : > "$RUNNER_TEMP/fast-ring/record.jsonl"
          status=0
          # Plan and check every slot (bin/check-mac-set, inside
          # promote-channel) before any publishes: a refusal on one
          # architecture leaves the other as it was. The refused slot joins
          # the record with the check's reasons.
          : > "$RUNNER_TEMP/fast-ring/preflight.jsonl"
          chmod 0666 "$RUNNER_TEMP/fast-ring/preflight.jsonl"
          for mirror in rc stable; do
            for parch in x86_64 aarch64; do
              list=${bases["$mirror $parch"]:-}
              [[ -n $list ]] || continue
              if ! docker run --rm \
                -e OMARCHY_PUBLISH_PREFIX \
                -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET \
                -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
                -v "$PWD:/w:ro" -v "$RUNNER_TEMP/fast-ring:/out" -v "$RUNNER_TEMP/recipe-index:/index:ro" -w /w omarchy-publisher \
                bin/promote-channel --remote R2:omarchy-pkgs --fast-ring --from edge --to "$mirror" --arch "$parch" \
                  --recipe-index /index/recipe-index.tsv --dry-run --record /out/preflight.jsonl $list; then
                echo "::error title=Mac package set::the fast-ring catch-up into $mirror/$parch was refused; nothing published"
                jq -nc --arg m "$mirror" --arg a "$parch" --arg bases "$list" --slurpfile r "$RUNNER_TEMP/fast-ring/preflight.jsonl" \
                  '{type: "slot", mirror: $m, arch: $a, status: "refused", packages: [],
                    pkgbases: ($bases | split(" ") | map(select(length > 0))),
                    mac_set: [$r[] | select(.type == "mac-set" and .channel == $m and .arch == $a) | del(.type)]}' \
                  >> "$RUNNER_TEMP/fast-ring/record.jsonl"
                status=1
                break 2
              fi
            done
          done
          (( status == 0 )) && for mirror in rc stable; do
            for parch in x86_64 aarch64; do
              list=${bases["$mirror $parch"]:-}
              [[ -n $list ]] || continue
              if ! docker run --rm \
                -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e OMARCHY_PUBLISH_PREFIX \
                -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET \
                -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
                -v "$PWD:/w:ro" -v "$RUNNER_TEMP/fast-ring:/out" -v "$RUNNER_TEMP/recipe-index:/index:ro" -w /w omarchy-publisher \
                bin/promote-channel --remote R2:omarchy-pkgs --fast-ring --from edge --to "$mirror" --arch "$parch" \
                  --recipe-index /index/recipe-index.tsv --record /out/record.jsonl $list; then
                status=1
                break 2
              fi
            done
          done
          # Its publishes join the run's record as slots, as the Publish
          # step's own do.
          jq -c 'select(.type == "slot") | del(.type)' "$RUNNER_TEMP/fast-ring/record.jsonl" > fast-ring-slots.jsonl
          jq --slurpfile extra fast-ring-slots.jsonl '.slots += $extra' publish-record.json > publish-record.tmp
          mv publish-record.tmp publish-record.json
          echo "fast-ring slots: $(wc -l < fast-ring-slots.jsonl)"
          exit $status

      - name: Keep the publish record
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: publish-record-${{ github.run_id }}
          path: publish-record.json
          retention-days: 90

      # Tell omarchy-mac-installer which aarch64 packages just reached edge;
      # it decides whether its Mac image needs a rebuild. Opt-in: without
      # MAC_INSTALLER_DISPATCH_TOKEN in the publish environment the script
      # prints a notice and sends nothing. Never fails the publish (the packages are
      # already out), and sends nothing for x86_64-only or proof publishes.
      # Runs after a failed publish too: edge/aarch64 goes before rc and
      # stable, and the record shows whether its slot landed.
      - name: Notify omarchy-mac-installer
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        env:
          MAC_INSTALLER_DISPATCH_TOKEN: ${{ secrets.MAC_INSTALLER_DISPATCH_TOKEN }}
        run: bin/mac-installer-dispatch publish-record.json

  # Tell people what happened. A comment on the merged PR (found by the
  # merge commit, so squash and rebase merges work too) and a line appended
  # to a running JSON log in the bucket, next to the packages it describes,
  # so the history is public and can be rendered later.
  report:
    needs: [changes, publish]
    if: always() && needs.publish.result != 'skipped'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: publish-record-${{ github.run_id }}
      - name: Render
        id: render
        env:
          OUTCOME: ${{ needs.publish.result }}
        run: |
          jq -r --arg outcome "$OUTCOME" '
            def pkgs: [.packages[] | select(test("-debug-")|not)] | join(", ");
            def src: if .source=="pr-artifact" then "PR artifact" elif .source=="rebuild" or .source=="native-rebuild" then "rebuilt at merge" elif .source=="built" then "built here" elif .source=="already-published" then "already published, skipped" else "**" + .source + "**" end;
            "### Publish " + (if $outcome=="success" then "succeeded" else "FAILED" end) +
            " → **" + .target + "**" + (if .target!="live" then " (proof prefix, not live)" else "" end),
            "",
            "Packages: " + ([.sources[] | .package + " (" + .arch + ", " + src + ")"] | join("; ")),
            "",
            (if (.slots|length) > 0 then (.slots[] | "- `" + .mirror + "/" + .arch + "`: " + (if .status=="published" then "" else "**" + .status + "** " end) + pkgs)
             elif ([.sources[] | select(.source=="already-published")] | length) == (.sources|length) then "_Nothing to publish: already at master'"'"'s version everywhere._"
             else "_Nothing was published._" end),
            "",
            (if ([.sources[] | select(.source|test("failed"))] | length) > 0 then "_A build failed, so no channel was touched._\n"
             elif (.plan|length) > (.slots|length) then "_Some planned slots did not run because an earlier slot failed._\n" else "" end),
            "Commit " + .commit[0:7] + " · [run](" + .run + ")"
          ' publish-record.json > comment.md
          cat comment.md
      - name: Append to the publish log in the bucket
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip && unzip -jq rclone.zip '*/rclone' && chmod +x rclone
          # One JSON object per line, newest last. Served at
          # https://pkgs.omarchy.org/publish-log.jsonl
          ./rclone copy R2:omarchy-pkgs/publish-log.jsonl . --s3-no-head 2>/dev/null || : > publish-log.jsonl
          jq -c . publish-record.json >> publish-log.jsonl
          ./rclone copyto publish-log.jsonl R2:omarchy-pkgs/publish-log.jsonl --s3-no-head
          echo "log now has $(wc -l < publish-log.jsonl) entries"

      - name: Comment on the merged PR
        # Only for a push: the merge commit names its PR. A dispatch runs
        # from master's head, whose PR merged something else entirely, so
        # commenting there would attach this run's report to the wrong PR.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr comment "$pr" -R "${{ github.repository }}" --body-file comment.md
            echo "commented on #$pr"
          else
            echo "no PR for ${{ github.sha }} (manual dispatch?); skipping PR comment"
          fi
  result:
    needs: [changes, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes result: ${{ needs.changes.result }}, publish result: ${{ needs.publish.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.publish.result }}" == "success" || "${{ needs.publish.result }}" == "skipped" ]]
