name: Refresh PGP keys

# Builds verify sources only against the keys shipped in
# pkgbuilds/*/keys/pgp/, never a keyserver. This daily check is how a
# revocation, a new expiry date or a new subkey reaches those files: it merges
# what each key's owner publishes and fails when anything changed, with the
# updated files attached. Nothing here builds or publishes, so a late or
# missed run only delays the news by a day.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Exit 1: key files changed. Exit 2: a key is revoked.
      - name: Refresh the shipped keys from their owners
        id: refresh
        run: |
          set +e
          bin/refresh-pgp-keys | tee refresh.txt
          status=${PIPESTATUS[0]}
          {
            echo '```'
            cat refresh.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( status != 0 )); then
            git diff --binary > refreshed-keys.patch
            echo "::error::Shipped PGP keys are out of date. Apply refreshed-keys.patch (or run bin/refresh-pgp-keys) and open a PR."
          fi
          exit "$status"
      - name: Attach the refreshed keys
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-keys
          path: refreshed-keys.patch
          retention-days: 30
