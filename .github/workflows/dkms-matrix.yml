name: DKMS matrix

# Builds DKMS modules against kernel headers on a channel, the way a machine
# does on an update (bin/check-dkms). A kernel that renames or drops something
# an out-of-tree module uses turns this red before users reboot into it:
# linux-omarchy 7.2.8-9 renamed battery_hook_register and the TUXEDO modules
# stopped building on 4.0.5.
#
# The work of the check, for its callers: dkms-check.yml (a pull request's
# build, daily, by hand) and promote.yml (what a promotion moves).
#
# Fanned out: `plan` reads the channel on the host in seconds
# (bin/check-dkms matrix), and every kernel and DKMS package pair gets its own
# leg, which installs that kernel's headers and builds that package's trees in
# a throwaway container. A leg is named for what it builds, so a red one says
# which pair broke: "build (x86_64, linux-omarchy 7.2.8-13, nvidia-open-dkms
# 615.78.08-3)". `summary` turns the legs into one verdict (bin/check-dkms
# report), which dkms-check.yml posts on a pull request as its one check.
#
# Read-only, all of it: no job here holds more than contents: read and
# actions: read, or any secret. A pull request's build is data here: its
# request is checked against a strict shape (bin/build-artifacts), and its
# packages are only unpacked inside a leg's throwaway container, where their
# Makefiles run.

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      since:
        description: Only what differs from this channel (empty means everything)
        type: string
        default: ""
      packages:
        description: Only these packages or pkgbases (space-separated); empty means all
        type: string
        default: ""
      from_repos:
        description: Only the DKMS packages from Arch's repositories, against every kernel
        type: boolean
        default: false
      all:
        description: Every pair on the channel, with the build's packages in place of the published ones
        type: boolean
        default: false
      build_run:
        description: A pull request's "Build changed packages" run; its packages are what is checked
        type: string
        default: ""
      head_sha:
        description: The commit that build was made from
        type: string
        default: ""
    outputs:
      conclusion:
        description: success or failure
        value: ${{ jobs.summary.outputs.conclusion }}
      title:
        description: '"N/M passed, K known broken, F failed", or why nothing was checked'
        value: ${{ jobs.summary.outputs.title }}
      summary:
        description: Markdown, a row per leg
        value: ${{ jobs.summary.outputs.summary }}

# bin/build-artifacts reads a pull request build's artifacts; the daily plan
# looks up which legs already built.
permissions:
  contents: read
  actions: read

env:
  CHANNEL: ${{ inputs.channel }}
  SINCE: ${{ inputs.since }}
  PACKAGES: ${{ inputs.packages }}
  FROM_REPOS: ${{ inputs.from_repos }}
  ALL: ${{ inputs.all }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      note: ${{ steps.plan.outputs.note }}
      local: ${{ steps.plan.outputs.local }}
    steps:
      # The caller's commit: master's for a pull request (workflow_run), so a
      # pull request cannot change the check that judges it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Plan the legs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING: ${{ hashFiles('bin/check-dkms', 'ci/dkms-packages') }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libarchive-tools >/dev/null
          args=(--channel "$CHANNEL")
          [[ -z $SINCE ]] || args+=(--since "$SINCE")
          [[ -z $PACKAGES ]] || args+=(--packages "$PACKAGES")
          [[ $FROM_REPOS != true ]] || args+=(--from-repos)
          [[ $ALL != true ]] || args+=(--all)
          note="" legs=""
          # A pull request's build: exactly what it would publish, that run's
          # artifacts and the ones its plan reused. The legs get only the
          # kernels and DKMS packages among them; a build that ships nothing
          # has none (with all, every pair on the channel still builds).
          if [[ -n $BUILD_RUN ]]; then
            if [[ ! $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::head_sha must be a full commit hash"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
            bin/build-artifacts built "$BUILD_RUN" "$HEAD_SHA"
            if compgen -G 'built/*.pkg.tar.*' >/dev/null; then
              args+=(--local built --save-local dkms-local)
              [[ $ALL != true ]] || note="Every pair on the channel, with this build's packages in place"
            elif [[ $ALL == true ]]; then
              note="Every pair on the channel; this build ships no packages"
            else
              note="This build ships no packages"
              legs='[]'
            fi
          fi
          # Each architecture on its own, so a failure in either stops here.
          if [[ -z $legs ]]; then
            x86_64=$(bin/check-dkms matrix --arch x86_64 "${args[@]}")
            aarch64=$(bin/check-dkms matrix --arch aarch64 "${args[@]}")
            legs=$(jq -cn --argjson a "$x86_64" --argjson b "$aarch64" '$a + $b')
          fi
          # Daily: a leg that built at these versions before is not built
          # again; each green leg saves its key (below, the same formula). An
          # unused cache entry expires after 7 days, so every pair is still
          # rebuilt weekly, on whatever toolchain edge has by then. Only this
          # ref's entries count: a pull request's run can save any key under
          # its own ref, which must not skip a daily leg.
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            keep='[]'
            while IFS= read -r leg; do
              key=$(jq -r --arg c "$CHANNEL" --arg t "${TOOLING:0:16}" \
                '"dkms-\($c)-\(.arch)-\(.kernel | gsub(" "; "_"))-\(.module | gsub(" "; "_"))-\($t)"' <<<"$leg")
              hits=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$key" -f ref="$GITHUB_REF" |
                jq --arg k "$key" --arg r "$GITHUB_REF" '[.actions_caches[] | select(.key == $k and .ref == $r)] | length')
              if ((hits)); then
                echo "built before: $key"
              else
                keep=$(jq -c --argjson l "$leg" '. + [$l]' <<<"$keep")
              fi
            done < <(jq -c '.[]' <<<"$legs")
            legs=$keep
          fi
          if [[ $legs == '[]' && -z $note && -n $BUILD_RUN ]]; then
            note="This build ships no kernel or DKMS package"
          fi
          shipped=false
          if compgen -G 'dkms-local/*' >/dev/null; then
            shipped=true
          fi
          {
            echo "legs=$legs"
            echo "note=$note"
            echo "local=$shipped"
          } >>"$GITHUB_OUTPUT"
          echo "$(jq length <<<"$legs") leg(s):"
          jq -r '.[] | "  \(.arch)  \(.kernel)  \(.module)"' <<<"$legs"
      - name: Keep the packages the legs install
        if: steps.plan.outputs.local == 'true' && steps.plan.outputs.legs != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: dkms-check-local
          path: dkms-local
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # One leg per kernel and DKMS package pair. A static name: GitHub appends
  # the leg's values, and a skipped job shows its name unevaluated.
  check:
    name: build
    needs: plan
    if: needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # A whole channel is about 45 legs; leave hosted runners for the
      # package builds, which share them.
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    # GitHub-hosted, with no secrets: the check only reads published packages,
    # and it installs them as root in a throwaway container.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      KERNEL: ${{ matrix.kernel }}
      MODULE: ${{ matrix.module }}
      RESULT: dkms-result-${{ strategy.job-index }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the build's kernels and DKMS packages
        if: needs.plan.outputs.local == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dkms-check-local
          path: built
      # The outcome (passed, known broken, failed, ...) is decided on the
      # host, from run's exit status, and written to $RESULT for `summary`.
      - name: Build ${{ matrix.module }} against ${{ matrix.kernel }}
        run: |
          args=(--arch "$ARCH" --channel "$CHANNEL" --kernel "$KERNEL" --module "$MODULE" --result "$RESULT")
          [[ -z $SINCE ]] || args+=(--since "$SINCE")
          [[ -z $PACKAGES ]] || args+=(--packages "$PACKAGES")
          [[ $FROM_REPOS != true ]] || args+=(--from-repos)
          [[ $ALL != true ]] || args+=(--all)
          [[ ! -d built ]] || args+=(--local built)
          bin/check-dkms container "${args[@]}"
      - name: Keep this leg's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkms-result-${{ strategy.job-index }}
          path: ${{ env.RESULT }}
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      # The daily plan skips a leg whose key exists (the same formula as there).
      - name: Remember this leg as built
        id: seen
        if: github.event_name == 'schedule'
        env:
          TOOLING: ${{ hashFiles('bin/check-dkms', 'ci/dkms-packages') }}
        run: |
          key="dkms-$CHANNEL-$ARCH-${KERNEL// /_}-${MODULE// /_}-${TOOLING:0:16}"
          mkdir -p .dkms-seen
          echo "$key" > .dkms-seen/key
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .dkms-seen
          key: ${{ steps.seen.outputs.key }}

  # One verdict for the run: N/M passed, K known broken, F failed, with a
  # row per leg. A leg that left no result counts as failed, and so does a
  # plan that did not finish.
  summary:
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.verdict.outputs.conclusion }}
      title: ${{ steps.verdict.outputs.title }}
      summary: ${{ steps.verdict.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Results are data for jq; nothing here runs them.
      - name: Fetch the legs' results
        if: needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dkms-result-*
          path: results
          merge-multiple: true
      - name: Decide
        id: verdict
        env:
          LEGS: ${{ needs.plan.outputs.legs }}
          NOTE: ${{ needs.plan.outputs.note }}
          PLAN: ${{ needs.plan.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p results
          printf '%s\n' "${LEGS:-[]}" >legs.json
          verdict=$(bin/check-dkms report --legs legs.json --results results --plan "$PLAN" --url "$URL" --note "$NOTE" --channel "$CHANNEL")
          jq -r .summary <<<"$verdict" >>"$GITHUB_STEP_SUMMARY"
          eof=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          {
            echo "conclusion=$(jq -r .conclusion <<<"$verdict")"
            echo "title=$(jq -r .title <<<"$verdict")"
            echo "summary<<$eof"
            jq -r .summary <<<"$verdict"
            echo "$eof"
          } >>"$GITHUB_OUTPUT"
          jq -r .title <<<"$verdict"
      - name: Fail when a leg failed
        if: steps.verdict.outputs.conclusion != 'success'
        env:
          TITLE: ${{ steps.verdict.outputs.title }}
        run: |
          echo "::error::DKMS check: $TITLE"
          exit 1
