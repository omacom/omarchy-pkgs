name: Auto-merge approved package PRs

# A package PR trusted to build is trusted to ship: once its builds are
# green it should merge and publish without a maintainer pressing the
# button. This enables GitHub's auto-merge on such PRs; branch protection
# still holds the merge until `result`, `self-tests` and `build-isolation`
# pass, and a red build stays an open PR. .github/scripts/auto-merge-pr.cjs
# has the rule.
#
# The omarchy-pkgs-merge App arms and withdraws auto-merge. GitHub merges as
# whoever armed it, and a merge made with the built-in GITHUB_TOKEN would
# not start publish.yml.
#
# pull_request_target runs this default-branch code with secrets; the PR's
# code is never checked out here. It reacts to a push within seconds, so a
# change that stops a PR qualifying withdraws auto-merge long before the
# new head's builds can turn green. A repository Actions policy allows this
# workflow's pull_request_target and workflow_dispatch events.
#
# Every base branch triggers it, and edited covers a base change: a PR moved
# off master must lose auto-merge, and decide() arms only PRs into master.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  # Decides with the read-only token whether apply needs to start. It runs
  # third-party actions (vouch installs Nushell), so it holds no environment
  # and no other secret. Only its vouch result reaches apply.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.action.outputs.action }}
      vouch: ${{ steps.vouch.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find the PR's author
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.NUMBER),
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('author', pr.user.login);

      - id: vouch
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          user: ${{ steps.pr.outputs.author }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        with:
          script: |
            const autoMerge = require('./.github/scripts/auto-merge-pr.cjs');
            await autoMerge({ github, context, core,
              number: Number(process.env.NUMBER), vouchStatus: process.env.VOUCH_STATUS });

      # The apply job mints a write token only when there is something to do:
      # arm a PR that is not armed, or take auto-merge back from one that is.
      # Any event on a PR that no longer qualifies takes auto-merge back, a
      # push included: GitHub keeps auto-merge through later pushes. That
      # includes auto-merge a maintainer enabled by hand on a PR outside the
      # rule; they merge it by hand instead (auto-merge-pr.cjs, withdraw).
      - name: Choose the action
        id: action
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          ENABLE: ${{ steps.decide.outputs.enable }}
          WITHDRAW: ${{ steps.decide.outputs.withdraw }}
        run: .github/scripts/auto-merge-action.sh "$PR" "$ENABLE" "$WITHDRAW"

  # Holds the merge App's key, and runs only first-party actions, the
  # default branch's scripts and gh. It decides again from the PR as it is
  # now, so a push or label change since decide is judged before any write,
  # and mints the write token only when the new decision needs one.
  apply:
    needs: decide
    if: ${{ needs.decide.outputs.action == 'enable' || needs.decide.outputs.action == 'withdraw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: bot-merge
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Decide again
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          VOUCH_STATUS: ${{ needs.decide.outputs.vouch }}
        with:
          script: |
            const autoMerge = require('./.github/scripts/auto-merge-pr.cjs');
            await autoMerge({ github, context, core,
              number: Number(process.env.NUMBER), vouchStatus: process.env.VOUCH_STATUS });

      - name: Choose the action
        id: action
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          ENABLE: ${{ steps.decide.outputs.enable }}
          WITHDRAW: ${{ steps.decide.outputs.withdraw }}
        run: .github/scripts/auto-merge-action.sh "$PR" "$ENABLE" "$WITHDRAW"

      - name: Get the merge App's token
        id: app
        if: ${{ steps.action.outputs.action != 'none' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PKGS_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PKGS_MERGE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # --match-head-commit: never arm a merge for a commit newer than the one
      # just judged. Withdrawing auto-merge that is already gone succeeds.
      - name: Arm or withdraw auto-merge
        if: ${{ steps.action.outputs.action != 'none' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTION: ${{ steps.action.outputs.action }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          METHOD: ${{ steps.decide.outputs.method }}
        run: |
          armed() { [[ "$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" == true ]]; }
          [[ $METHOD == merge ]] || METHOD=squash
          case $ACTION in
            enable)
              armed && { echo "auto-merge already enabled on #$PR"; exit 0; }
              gh pr merge --auto "--$METHOD" --match-head-commit "$HEAD_SHA" "$PR" -R "$GITHUB_REPOSITORY"
              ;;
            withdraw)
              if armed; then gh pr merge --disable-auto "$PR" -R "$GITHUB_REPOSITORY"; fi
              ;;
          esac
