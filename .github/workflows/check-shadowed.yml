name: Check Shadowed Packages

on:
  pull_request:
    paths:
      - 'pkgbuilds/**'
      - 'helpers/**'
      - 'bin/check-shadowed'
      - 'release/shadowed-packages.txt'
      - '.github/workflows/check-shadowed.yml'
  schedule:
    # Daily, off the hour to dodge the scheduling backlog at :00
    - cron: '40 5 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request answers for the packages it touches, so a package
      # elsewhere that Arch has passed does not turn every pull request red;
      # the daily run reports that one. A change to the check, the list or the
      # helpers is checked against the whole tree. Directory names come from
      # the pull request, so each must be a plain package name before any
      # shell sees it.
      - name: Pick the packages to check
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          packages=()
          if [[ -n $BASE_SHA ]] && git diff --quiet "$BASE_SHA"...HEAD -- \
            bin/check-shadowed release/shadowed-packages.txt helpers .github/workflows/check-shadowed.yml; then
            mapfile -t packages < <(git diff --name-only "$BASE_SHA"...HEAD -- pkgbuilds/ | cut -d/ -f2 | sort -u)
            for package in "${packages[@]}"; do
              [[ $package =~ ^[a-z0-9@._+-]+$ ]] || { echo "::error::Not a package directory name: $package"; exit 1; }
            done
            echo "Checking the pull request's packages: ${packages[*]}"
          else
            echo "Checking the whole tree"
          fi
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

      # Runs in an Arch container because the comparison has to be the one users
      # get: Arch's own repositories for what it ships, and vercmp for which of
      # the two builds pacman calls newer. Exit 1 is a finding; anything else
      # means the check could not run, and the status output tells them apart.
      - name: Check the packages that shadow Arch
        id: check
        env:
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          status=0
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e PACKAGES \
            -v "$PWD/bin:/workspace/bin:ro" \
            -v "$PWD/helpers:/workspace/helpers:ro" \
            -v "$PWD/pkgbuilds:/workspace/pkgbuilds:ro" \
            -v "$PWD/release:/workspace/release:ro" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail

              # multilib is disabled in the stock image, and multilib is where
              # umu-launcher sat behind an older Omarchy build for three months.
              printf "\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n" >> /etc/pacman.conf
              pacman -Sy --noconfirm || exit 2

              # The check sources every PKGBUILD, so it does not run as root: a
              # pull request could otherwise replace vercmp in the container and
              # have its own comparison come back equal.
              groupadd -g "$HOST_GID" runner || exit 2
              useradd -m -u "$HOST_UID" -g "$HOST_GID" runner || exit 2

              read -ra packages <<<"$PACKAGES"
              runuser -u runner -- ./bin/check-shadowed "${packages[@]}"
            ' || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Only on a finding, and only on the schedule: a pull request reports its
      # own result, while Arch pulling ahead of a package here happens with
      # nobody watching. A Docker or mirror failure exits with another status
      # and would otherwise announce a problem that does not exist.
      - name: Notify Basecamp
        if: failure() && steps.check.outputs.status == '1' && github.event_name == 'schedule' && env.BASECAMP_CHATBOT_URL != ''
        env:
          BASECAMP_CHATBOT_URL: ${{ secrets.BASECAMP_CHATBOT_URL }}
        run: |
          curl -sS --fail -o /dev/null \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content \
              "🔴 <strong>The shadowed package check failed</strong><br>A package that replaces Arch's build is behind it, or is missing from release/shadowed-packages.txt, or the list names one that shadows nothing.<br><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a>" \
              '{content: $content}')" \
            "$BASECAMP_CHATBOT_URL"
