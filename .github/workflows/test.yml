name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      - name: Run self-tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm git jq
              ./bin/sync-upstream self-test
              ./bin/sync-rebuilds --self-test
              ./bin/omarchy-pkgs self-test
              ./bin/omarchy-release self-test
            '

  request-validator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The validator runs on every request PR, in a stage with no network and
      # no secrets. `cargo test` covers that stage without one either: rule 6
      # is the only networked rule and its tests drive scripted responses
      # rather than the live internet.
      - name: Build and test the request validator
        working-directory: tools/opr-request-validate
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
