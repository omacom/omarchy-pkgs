name: Tests

# PR-only. Publishing on push has its own workflow and is what verifies the
# merged tree: it resolves every package against the live channel and refuses
# a filename that already exists with different bytes, so two PRs cannot land
# the same version twice. A post-merge test run would only repeat the PR's.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fixture builder
        run: docker build -t omarchy-build-isolation-test -f tests/build-isolation.Dockerfile tests
      - name: Verify isolated builds with real pacman transactions
        env:
          CONTAINER_ENGINE: docker
          TEST_BUILDER_IMAGE: omarchy-build-isolation-test
        run: tests/build-isolation.sh

  # namcap reads one PKGBUILD at a time. The tree has zero non-split namcap
  # errors, so any non-split E: error on a changed recipe fails the PR directly.
  # The split-makedepends rule is printed but never gates: it fires on any
  # split package whose parts depend on each other.
  recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on non-split namcap errors
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then echo "not a pull request: nothing to compare"; exit 0; fi
          changed_file=$(mktemp)
          trap 'rm -f "$changed_file"' EXIT
          git diff -z --no-renames --name-only --diff-filter=AM "$base"...HEAD -- 'pkgbuilds/*/PKGBUILD' > "$changed_file"
          mapfile -d "" -t files < "$changed_file"
          (( ${#files[@]} )) || { echo "no recipe changed"; exit 0; }
          docker run --rm -i -v "$PWD:/w:ro" -w /w \
            ghcr.io/archlinux/archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm namcap >/dev/null
              gate=" E: "
              skip="Split PKGBUILD needs additional makedepends"
              status=0
              while IFS= read -r -d "" f; do
                now=$(namcap -i "$f" 2>&1)
                d=${f%/PKGBUILD}
                printf "%s\n" "$now" | grep -E " (E|W): " | sed "s#^#$d #" || true
                errs=$(printf "%s\n" "$now" | grep "$gate" | grep -v "$skip" || true)
                if [[ -n "$errs" ]]; then
                  printf "%s\n" "$errs" | sed "s#^#::error file=$f::#"
                  status=1
                fi
              done
              exit $status' < "$changed_file"

  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base, for bin/release-owners --base.
          fetch-depth: 2

      - name: Test PR workflow approval
        run: node --test tests/pr-workflow-approval.cjs

      - name: Test upstream sync reporting
        run: node --test tests/sync-upstream-summary.cjs

      - name: Test builder images
        run: node --test tests/builder-image.cjs

      # Every PGP key a PR adds or modifies must already match what WKD and
      # keys.openpgp.org serve, so a trimmed or stale copy cannot land and trip
      # the daily refresh-pgp-keys alert after merge. PRs that do not touch
      # keys/pgp/ make no network calls.
      - name: Check changed PGP keys
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          mapfile -t keys < <(git diff --no-renames --name-only --diff-filter=AM HEAD^1 HEAD -- 'pkgbuilds/*/keys/pgp/*.asc')
          (( ${#keys[@]} )) || { echo "no PGP keys added or modified"; exit 0; }
          status=0
          bin/refresh-pgp-keys --check -- "${keys[@]}" || status=$?
          if (( status == 2 )); then
            echo "::error::A changed PGP key is revoked. Stop trusting it until upstream names its replacement."
            exit 2
          elif (( status != 0 )); then
            echo "::error::Changed PGP keys are out of date. Run bin/refresh-pgp-keys and commit the result."
            exit "$status"
          fi

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      #
      # release/owners.json lists which directory makes which package
      # names. A pull request that changes only recipes reads only those,
      # and takes every other entry from the merge commit's base; any other
      # change reads them all. The tool reads recipes as nobody
      # (bin/release-owners).
      - name: Run self-tests
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          docker run --rm -e BASE \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            ghcr.io/archlinux/archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm git jq python python-yaml libarchive neovim tmux rclone
              python tests/run-self-tests.py
            '

  # jactionlint over every workflow and dependabot.yml, with shellcheck over
  # each run: block, and shellcheck over the scripts in .github/scripts. It
  # lives here, not in a workflow of its own, so build-approved releases it
  # with the other tests on a fork PR (.github/scripts/approve-pr-workflows.cjs).
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check out the repository
    # bash -eo pipefail, not the default bash -e: a failing git ls-files fails
    # the shellcheck step instead of leaving it nothing to check.
    defaults:
      run:
        shell: bash
    # Release binaries pinned by version and sha256, shellcheck included: the
    # runner image's own shellcheck changes with the image, and with it what
    # jactionlint reports. To update one, change its version and take the new
    # sha256 from the release's assets. jdx/jactionlint's own action is not
    # used: its download checks no checksum.
    env:
      JACTIONLINT_VERSION: 2.4.0
      JACTIONLINT_SHA256: 26ddba81db28fffc51163175c070ee1a9d1150260de4b5232f01d9b749f32d8e
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install jactionlint and shellcheck
        id: tools
        run: |
          set -euo pipefail
          bin=$RUNNER_TEMP/lint-tools
          mkdir -p "$bin"
          fetch() {
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$3" "$1"
            echo "$2  $RUNNER_TEMP/$3" | sha256sum --check --strict
          }
          fetch "https://github.com/jdx/jactionlint/releases/download/v$JACTIONLINT_VERSION/jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$JACTIONLINT_SHA256" jactionlint.tar.gz
          tar -xzf "$RUNNER_TEMP/jactionlint.tar.gz" -C "$bin" jactionlint
          fetch "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            "$SHELLCHECK_SHA256" shellcheck.tar.gz
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$bin" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"

      # Reads .github/jactionlint.yaml for the profile and the self-hosted
      # runner labels. Each finding is an error annotation on its line; a
      # shellcheck finding sits on the script line it is about.
      - name: Run jactionlint
        run: jactionlint --format github

      # Runs even when jactionlint failed, so one run reports every problem.
      - name: Run shellcheck on .github/scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '.github/scripts/*.sh' | xargs -0 -r shellcheck
