name: Tests

# PR-only. Publishing on push has its own workflow and is what verifies the
# merged tree: it resolves every package against the live channel and refuses
# a filename that already exists with different bytes, so two PRs cannot land
# the same version twice. A post-merge test run would only repeat the PR's.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixture builder
        run: docker build -t omarchy-build-isolation-test -f tests/build-isolation.Dockerfile tests
      - name: Verify isolated builds with real pacman transactions
        env:
          CONTAINER_ENGINE: docker
          TEST_BUILDER_IMAGE: omarchy-build-isolation-test
        run: tests/build-isolation.sh

  # namcap reads one PKGBUILD at a time, so this lints the recipes a PR
  # changes and fails on errors that are new against the base branch: the tree
  # already carries 23, and nobody touching omarchy-nvim should inherit them.
  # The split-makedepends rule is printed but never gates: it fires on any
  # split package whose parts depend on each other (19 of the 23).
  recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on namcap errors the base branch did not have
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then echo "not a pull request: nothing to compare"; exit 0; fi
          mapfile -t dirs < <(git diff --name-only "$base"...HEAD -- 'pkgbuilds/*/PKGBUILD' | xargs -r -n1 dirname | sort -u)
          (( ${#dirs[@]} )) || { echo "no recipe changed"; exit 0; }
          base_tree=$(mktemp -d); trap 'rm -rf "$base_tree"' EXIT
          for d in "${dirs[@]}"; do
            mkdir -p "$base_tree/$d"
            git show "$base:$d/PKGBUILD" >"$base_tree/$d/PKGBUILD" 2>/dev/null || rm -rf "$base_tree/$d"
          done
          docker run --rm -e DIRS="${dirs[*]}" -v "$PWD:/w:ro" -v "$base_tree:/base:ro" -w /w \
            ghcr.io/archlinux/archlinux:base-devel bash -lc '
              pacman -Sy --noconfirm namcap >/dev/null
              gate=" E: "
              skip="Split PKGBUILD needs additional makedepends"
              status=0
              for d in $DIRS; do
                now=$(namcap -i "$d/PKGBUILD" 2>&1; true)
                printf "%s\n" "$now" | grep -E " (E|W): " | sed "s#^#$d #" || true
                was=""
                [[ -f /base/$d/PKGBUILD ]] && was=$(namcap -i "/base/$d/PKGBUILD" 2>&1; true)
                new=$(comm -23 <(printf "%s\n" "$now" | grep "$gate" | grep -v "$skip" | sort) \
                                 <(printf "%s\n" "$was" | grep "$gate" | grep -v "$skip" | sort) || true)
                if [[ -n "$new" ]]; then
                  printf "%s\n" "$new" | sed "s#^#::error file=$d/PKGBUILD::#"
                  status=1
                fi
              done
              exit $status'

  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tests/promotion-regression.sh compares promotions against the tooling
      # of master before the Mac package-set check.
      - name: Fetch the promotion baseline
        run: git fetch --no-tags --depth=1 origin be8ab9bda3e53b163153944395f1912ac6d7f44f

      - name: Test PR workflow approval
        run: node --test tests/pr-workflow-approval.cjs

      - name: Test upstream sync reporting
        run: node --test tests/sync-upstream-summary.cjs

      - name: Test builder images
        run: node --test tests/builder-image.cjs

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      - name: Run self-tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            ghcr.io/archlinux/archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm git jq python libarchive neovim tmux
              python tests/owe-package-restart.py
              python tests/oma-service-removal.py
              python tests/passwordless-package-lifecycle.py
              python tests/upstream-watch.py
              runuser -u nobody -- python tests/aurora-edge/metadata.py
              python tests/aurora-edge/review.py
              python tests/aurora-edge/firmware.py
              bash tests/ipu7-install.sh
              bash tests/ipu7-headers.sh
              ./bin/sync-upstream self-test
              ./tests/upstream-github-fetch.sh
              ./bin/sync-rebuilds --self-test
              ./bin/omarchy-pkgs self-test
              ./bin/omarchy-release self-test
              ./tests/neovim-remote-clipboard.sh
              python tests/neovim-clipboard-tmux.py
              ./tests/published-build-plan.sh
              ./tests/settings-boot-config.sh
              ./tests/settings-etc-overrides.sh
              ./tests/settings-runtime-profile.sh
              ./tests/passwordless-package-files.sh
              ./tests/pinned-sources.sh
              ./tests/package-metadata.sh
              ./tests/pkgname-unique.sh
              ./tests/unpublish-plan.sh
              ./tests/fast-ring-check.sh
              ./tests/controller.sh
              ./tests/artifact-helpers.sh
              ./tests/build-matrix.sh
              ./tests/mac-installer-dispatch.sh
              ./tests/limine-mkinitcpio-hook.sh
              ./tests/voxtype-bin-install.sh
              ./tests/1password-polkit-owners.sh
              ./tests/superwhisper-bin-install.sh
              pacman -S --noconfirm --quiet rclone >/dev/null
              ./tests/publish-artifact.sh
              ./tests/promote-channel.sh
              ./tests/mac-package-set.sh
              BASELINE_REF=be8ab9bda3e53b163153944395f1912ac6d7f44f ./tests/promotion-regression.sh
              shopt -s nullglob
              for test in pkgbuilds/*/test.sh; do
                bash "$test"
              done
            '
