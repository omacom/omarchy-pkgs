name: Build aarch64 Packages

# Build aarch64 packages on a native ARM64 runner without QEMU. This manual
# workflow complements the repository host's scheduled build pipeline.
#
# To publish, download and extract the artifact ON THE REPOSITORY HOST into
# build-output/<mirror>/aarch64, using the same mirror as the build, then run:
#
#   bin/upload-prebuilt --arch aarch64 --mirror <mirror>
#
# This signs, promotes, updates omarchy.db, and syncs under one release lock.
# The workflow itself only uploads unsigned artifacts and needs no publishing
# credentials. Packages whose arch=() excludes aarch64 are skipped.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Recipe names, including repository dependencies (space-separated; empty for all)'
        required: false
        default: ''
      mirror:
        description: 'Mirror to build against'
        required: false
        default: edge
        type: choice
        options:
          - edge
          - rc
          - stable

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # A full build may exceed GitHub's six-hour job limit. Targeted builds
    # must include required recipes from this repository: dependencies are
    # not automatically added to the selected set. For example, building
    # omarchy also requires the matching omarchy-settings recipe.
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm the runner is natively aarch64
        # bin/build falls back to QEMU when it finds an x86_64 host. That still
        # produces correct packages, but takes many times longer -- long enough
        # to hit the job timeout. If this ever runs somewhere else, fail loudly
        # rather than silently emulating.
        run: |
          set -euo pipefail
          arch=$(uname -m)
          echo "Runner architecture: $arch"
          if [[ $arch != "aarch64" ]]; then
            echo "::error::Expected a native aarch64 runner, got $arch." \
                 "Building aarch64 under emulation here would exceed the job timeout."
            exit 1
          fi

      - name: Build packages
        env:
          PACKAGES: ${{ inputs.packages }}
          MIRROR: ${{ inputs.mirror }}
        run: |
          set -euo pipefail
          if [[ -n $PACKAGES ]]; then
            bin/build --arch aarch64 --mirror "$MIRROR" --package "$PACKAGES"
          else
            bin/build --arch aarch64 --mirror "$MIRROR"
          fi

      - name: Summarize what was built
        if: always()
        env:
          MIRROR: ${{ inputs.mirror }}
        run: |
          set -euo pipefail
          output="build-output/$MIRROR/aarch64"
          {
            echo "## aarch64 packages ($MIRROR)"
            echo
            if compgen -G "$output/*.pkg.tar.*" >/dev/null; then
              echo '```'
              (cd "$output" && ls -1 ./*.pkg.tar.*)
              echo '```'
            else
              echo "No packages were produced."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-aarch64-${{ inputs.mirror }}-${{ github.run_id }}
          path: build-output/${{ inputs.mirror }}/aarch64
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Basecamp on failure
        if: failure() && env.BASECAMP_CHATBOT_URL != ''
        env:
          BASECAMP_CHATBOT_URL: ${{ secrets.BASECAMP_CHATBOT_URL }}
        run: |
          curl -s -o /dev/null \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content \
              "🔴 <strong>aarch64 build failed</strong><br><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a>" \
              '{content: $content}')" \
            "$BASECAMP_CHATBOT_URL"
