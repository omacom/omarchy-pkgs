name: BCM4360 contribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, workstation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash tests/package-metadata.sh && bash tests/pinned-sources.sh && bash tests/pkgname-unique.sh && bash tests/pgp-keys-vendored.sh
      - run: shellcheck -s bash -e SC2034,SC2154 pkgbuilds/broadcom-wl-wpa3-dkms/PKGBUILD pkgbuilds/broadcom-wl-wpa3-dkms/dkms.conf.in && git diff --check && gitleaks dir --redact --no-banner pkgbuilds/broadcom-wl-wpa3-dkms
