name: Unpublish retired packages

# Takes packages out of the channel databases after their recipes are gone
# from master. Deleting a recipe stops it building; this stops pacman
# offering it. Files stay in the bucket (see bin/unpublish-packages).
#
# Only entries no recipe on master publishes there (bin/unpublish-plan): one
# a recipe still publishes would come back on its next publish, and refusing
# it keeps a typo from pulling a live package out of every channel. A recipe
# that dropped an architecture (pinta is aarch64-only) is retired from the
# other one and kept where it still builds.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated pkgbases whose recipes were removed from master or no longer build for an architecture"
        required: true
      channels:
        description: "Channels to remove them from"
        required: true
        default: "edge rc stable"

jobs:
  # Planning reads the recipes; it happens here, in a job of its own. Its
  # plan is a JSON object of RETIRE_<CHANNEL>_<ARCH> lists.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      retire: ${{ steps.plan.outputs.retire }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Plan what no recipe publishes
        id: plan
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          CHANNELS: ${{ github.event.inputs.channels }}
        run: |
          set -euo pipefail
          bin/unpublish-plan --channels "$CHANNELS" $PACKAGES > plan.env
          cat plan.env
          echo "retire=$(jq -Rnc '[inputs | capture("^(?<k>RETIRE_[A-Z0-9_]+)=(?<v>.*)$") | {(.k): .v}] | add // {}' < plan.env)" >> "$GITHUB_OUTPUT"

  unpublish:
    needs: plan
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 15
    # The publish job's group: one writer per channel database at a time.
    # queue: max, as there: a waiting job is queued, not replaced.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # Only what the dispatch named, from the channels it named.
      - name: Unpublish
        env:
          RETIRE: ${{ needs.plan.outputs.retire }}
          PACKAGES: ${{ github.event.inputs.packages }}
          CHANNELS: ${{ github.event.inputs.channels }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OMARCHY_PUBLISH_PREFIX: ${{ vars.OMARCHY_PUBLISH_PREFIX }}
        run: |
          set -euo pipefail
          # repo-remove and bsdtar are Arch tools: run in the publisher image
          # (ci/publisher.Dockerfile: Arch packages only), as the publish job
          # does.
          docker build --quiet -t omarchy-publisher -f ci/publisher.Dockerfile ci
          for mirror in $CHANNELS; do
            [[ $mirror == edge || $mirror == rc || $mirror == stable ]] || { echo "::error::Unknown channel: $mirror"; exit 1; }
            for arch in x86_64 aarch64; do
              retire=()
              for p in $(jq -r --arg k "RETIRE_${mirror^^}_${arch^^}" '.[$k] // ""' <<<"$RETIRE"); do
                if [[ ! $p =~ ^[a-z0-9][a-z0-9@._+-]*$ || " $PACKAGES " != *" $p "* ]]; then
                  echo "::error::The plan names $p for $mirror/$arch, which this run was not asked to unpublish"
                  exit 1
                fi
                retire+=("$p")
              done
              (( ${#retire[@]} )) || continue
              docker run --rm \
                -e OMARCHY_PUBLISH_PREFIX \
                -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET \
                -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
                -v "$PWD:/w:ro" -w /w omarchy-publisher \
                bin/unpublish-packages --remote R2:omarchy-pkgs --mirror "$mirror" --arch "$arch" "${retire[@]}"
            done
          done
