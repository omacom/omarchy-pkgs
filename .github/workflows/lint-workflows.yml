name: Lint workflows

# actionlint over every workflow, with shellcheck over each run: block, and
# shellcheck over the scripts in .github/scripts. It runs on every pull
# request, in about ten seconds, so it can become a required check: a paths
# filter would leave the PRs it skips waiting on it forever.
on:
  pull_request:
  push:
    branches: [master]
    paths: [".github/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-workflows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check out the repository
    # Release binaries pinned by version and sha256, shellcheck included: the
    # runner image's own shellcheck changes with the image, and with it what
    # actionlint reports. To update one, change its version and take the new
    # sha256 from the release's assets.
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and shellcheck
        id: tools
        run: |
          set -euo pipefail
          bin=$RUNNER_TEMP/lint-tools
          mkdir -p "$bin"
          fetch() {
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$3" "$1"
            echo "$2  $RUNNER_TEMP/$3" | sha256sum --check --strict
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" actionlint.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          fetch "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            "$SHELLCHECK_SHA256" shellcheck.tar.gz
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$bin" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"

      # Reads .github/actionlint.yaml for the self-hosted runner labels and
      # the one message it gets wrong. Each finding is an error annotation on
      # its line; a shellcheck finding sits on its step's run: line, and its
      # message gives the line in the script (SC2086:info:16:24 is line 16).
      - name: Run actionlint
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # a Go template for actionlint, not shell
          actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint {{$err.Kind}}::{{$err.Filepath}}:{{$err.Line}}:{{$err.Column}}: {{$err.Message}}\n{{end}}'

      # Runs even when actionlint failed, so one run reports every problem.
      - name: Run shellcheck on .github/scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '.github/scripts/*.sh' | xargs -0 -r shellcheck
