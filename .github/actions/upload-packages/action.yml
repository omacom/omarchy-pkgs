name: Upload packages one by one
description: >-
  Uploads each package a build made as an artifact of its own, unzipped, so
  the artifact's digest is the SHA-256 of the package file itself, and an
  index that lists them: index-<dir>-<arch>-<tree>.json. An artifact name
  cannot hold ':', so an epoch's ':' is written %3A in the artifact's name;
  the index keeps each file's real name. The packages.tar artifact that
  publish.yml collects today is uploaded beside these, unchanged.

inputs:
  dir:
    description: Package directory under pkgbuilds/
    required: true
  arch:
    description: Architecture the build ran for
    required: true
  tree:
    description: Git tree hash of pkgbuilds/<dir> that was built
    required: true
  path:
    description: Directory that holds the built *.pkg.tar.zst files
    required: true
  retention-days:
    description: Days to keep the artifacts
    default: "7"

runs:
  using: composite
  steps:
    # One upload step per file, since the upload action takes one unzipped
    # file at a time: 16 slots. The largest build today makes 11 files
    # (libretro-vice-git: 10 packages and a debug package); a build with
    # more fails here instead of leaving packages out.
    - id: prep
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        ARCH: ${{ inputs.arch }}
        TREE: ${{ inputs.tree }}
        SRC: ${{ inputs.path }}
      run: |
        set -euo pipefail
        [[ $DIR =~ ^[a-z0-9@_+][a-z0-9@._+-]*$ && $ARCH =~ ^(x86_64|aarch64)$ && $TREE =~ ^[0-9a-f]{40}$ ]] || {
          echo "::error::bad dir, arch or tree: $DIR $ARCH $TREE"; exit 1; }
        out="$RUNNER_TEMP/upload-packages"
        rm -rf "$out"; mkdir -p "$out"
        entries=() n=0
        for f in "$SRC"/*.pkg.tar.zst; do
          [[ -e $f ]] || continue
          name=${f##*/}
          [[ $name =~ ^[A-Za-z0-9@_+][A-Za-z0-9@._+:-]*\.pkg\.tar\.zst$ && ${#name} -le 251 ]] || {
            echo "::error::package file name not allowed: $name"; exit 1; }
          n=$((n + 1))
          (( n <= 16 )) || { echo "::error::more than 16 package files; add upload slots"; exit 1; }
          cp -- "$f" "$out/${name//:/%3A}"
          sum=$(sha256sum -- "$f" | cut -d' ' -f1)
          size=$(stat -c %s -- "$f")
          entries+=("{\"file\":\"$name\",\"sha256\":\"$sum\",\"size\":$size}")
          echo "f$n=$out/${name//:/%3A}" >> "$GITHUB_OUTPUT"
        done
        (( n > 0 )) || { echo "::error::no *.pkg.tar.zst in $SRC"; exit 1; }
        index="$out/index-$DIR-$ARCH-$TREE.json"
        printf '{"version":1,"dir":"%s","arch":"%s","tree":"%s","packages":[%s]}' \
          "$DIR" "$ARCH" "$TREE" "$(IFS=,; echo "${entries[*]}")" > "$index"
        echo "index=$index" >> "$GITHUB_OUTPUT"
        cat "$index"; echo

    - if: steps.prep.outputs.f1 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f1 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f2 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f2 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f3 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f3 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f4 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f4 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f5 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f5 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f6 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f6 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f7 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f7 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f8 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f8 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f9 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f9 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f10 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f10 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f11 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f11 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f12 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f12 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f13 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f13 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f14 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f14 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f15 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f15 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
    - if: steps.prep.outputs.f16 != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.f16 }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }

    # Last, so an index names only packages that are all uploaded.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { path: "${{ steps.prep.outputs.index }}", archive: false, overwrite: true, if-no-files-found: error, retention-days: "${{ inputs.retention-days }}" }
