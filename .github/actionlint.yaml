# actionlint's settings for lint-workflows.yml. The format is described in
# https://github.com/rhysd/actionlint/blob/main/docs/config.md.

# The labels of the runners that are not GitHub-hosted. actionlint reports
# any other label in runs-on as unknown. Today the workflows name these
# through expressions, which actionlint does not evaluate, so this is for the
# next workflow that names one directly.
#   omarchy-builder: the DigitalOcean droplet pool that ci/controller.sh runs
#   namespace-profile-arm64-linux-apple-12x32: Namespace's Apple-backed
#     runner for aarch64 kernels (package_runner in helpers/package-metadata.sh)
self-hosted-runner:
  labels:
    - omarchy-builder
    - namespace-profile-arm64-linux-apple-12x32

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # `queue: max` under concurrency is a GitHub feature actionlint 1.7.12
      # does not know yet (rhysd/actionlint#657). The jobs that write to the
      # channel databases use it so that a waiting run is queued instead of
      # replacing the one already waiting. Drop this once actionlint knows it.
      - '^unexpected key "queue" for "concurrency" section\.'
