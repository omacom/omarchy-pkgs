# Surface Laptop 7 touchpad (both sizes). A nearly round contact flips its
# orientation between 0 and ~110 degrees from frame to frame; iptsd took that
# for an unstable contact and dropped the frame, so fast swipes stuttered and
# then jumped. The touchpad pointer does not use orientation.
#
# Its positions jitter by about 0.05 mm from frame to frame, which made slow
# movements step back and forth, and the position threshold that hid it made
# them step in jumps of 0.2 to 0.3 mm. The position filter smooths slow
# movements instead and lets fast ones through within a frame.

[Device]
Vendor = 0x045E
Product = 0x0C77

[Contacts]
OrientationThresholdMax = 180
PositionThresholdMin = 0
PositionFilterMinCutoff = 1.5
PositionFilterBeta = 1.2
