# Use case Configuration for sof-soundwire card
# TAS2783A quad amp array (HP EliteBook X G2i, board 8E86, link 2,
# unique_id 0x9/0xA/0xC/0xD). No upstream UCM profile exists for this
# rt712+tas2783A pairing as of this writing.
#
# sof-soundwire/HiFi.conf includes "/sof-soundwire/${SpeakerCodecFile}.conf"
# with no whitelist, and SpeakerCodecFile resolves to "tas2783" from the
# " spk:tas2783" the kernel reports in card->components. So this file is picked
# up by stock alsa-ucm-conf with no change to any file it owns.

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
		# Safety headroom: these per-amp digital trims default to hardware
		# max (200 = 0dB) and are NOT reachable by PipeWire's own volume
		# slider (which only controls "Post Mixer Speaker Playback
		# Volume", a separate downstream stage). Without this, 100% in
		# software would still drive all 4 amps at true hardware max.
		# 176 = -100dB + 176*0.5dB = -12dB fixed headroom, independent of
		# whatever the user sets via the normal volume control.
		cset "name='tas2783-1 Speaker Volume' 176"
		cset "name='tas2783-2 Speaker Volume' 176"
		cset "name='tas2783-3 Speaker Volume' 176"
		cset "name='tas2783-4 Speaker Volume' 176"
		# Analog output gain, 0-20 (11 dB + 0.5 dB/step). HP's amp firmware
		# programs 12 (17 dB) on all four parts (AMP_LEVEL, page 0 reg 0x03,
		# value 0x18 in every 8E86 image). The driver's register default is
		# 20 (21 dB), and a regcache sync puts that back over the firmware
		# value, which is why the two sides once differed (12 vs 20). Pin
		# HP's 12 on all four: the DSP limiter and speaker protection are
		# tuned for that gain.
		cset "name='tas2783-1 Amp Volume' 12"
		cset "name='tas2783-2 Amp Volume' 12"
		cset "name='tas2783-3 Amp Volume' 12"
		cset "name='tas2783-4 Amp Volume' 12"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackVolume "Post Mixer Speaker Playback Volume"
	}
}
