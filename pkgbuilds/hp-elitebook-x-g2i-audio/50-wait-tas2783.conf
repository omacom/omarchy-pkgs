[Service]
# Wait for the TAS2783 amp controls to appear before WirePlumber enumerates the
# card, so it does not build a profile from a half-enumerated device.
#
# The leading "-" is deliberate and load-bearing. This guard is an optimisation:
# without it the amps sometimes enumerate late and the audio-recover user unit
# heals it a moment later. But WirePlumber treats a failed ExecStartPre as a
# failed start, and a failed WirePlumber is not "no speakers", it is no audio at
# all -- no card, no sinks, nothing. Trading a boot race for total silence is a
# bad trade, so a guard that cannot run must not be able to stop WirePlumber.
#
# Observed on the reference machine: a stale drop-in of this name left in
# /etc/systemd/user, which outranks this file, pointed ExecStartPre at a path
# that no longer existed. WirePlumber hit 203/EXEC, exhausted its restart limit
# and gave up. The kernel side was perfectly healthy the entire time.
ExecStartPre=-/usr/bin/wait-tas2783-controls
