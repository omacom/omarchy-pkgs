Syntax 8

# HP EliteBook X G2i (board 8E86): four TAS2783A amps on SoundWire link 2.
#
# This path is probed before conf.d/sof-soundwire/sof-soundwire.conf, so it
# stands in for the card configuration on this model alone. It takes the stock
# configuration unchanged and only points the speaker file at our own, because
# alsa-ucm-conf ships its own sof-soundwire/tas2783.conf and two packages
# cannot own one path.
#
# Gated on an amp control so a machine whose amps did not enumerate falls back
# to the stock file instead of a speaker definition it cannot drive.

Include.base.File "/sof-soundwire/sof-soundwire.conf"

If.hp_elitebook_x_g2i_amps {
	Condition {
		Type ControlExists
		Control "name='tas2783-1 Amp Volume'"
	}
	True.Define.SpeakerCodecFile "tas2783-hp-elitebook-x-g2i"
}
