PACKAGE_NAME="@_PKGBASE@"
PACKAGE_VERSION="@PKGVER@"
AUTOINSTALL="yes"
CLEAN="make clean"

# The keyboard and touchpad driver, applespi, is in mainline (CONFIG_KEYBOARD_APPLESPI);
# only the iBridge, Touch Bar and ambient light modules come from here.
BUILT_MODULE_NAME[0]="apple-ibridge"
BUILT_MODULE_NAME[1]="apple-ib-tb"
BUILT_MODULE_NAME[2]="apple-ib-als"
MAKE[0]="make KDIR=/usr/lib/modules/$kernelver/build"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc"
DEST_MODULE_LOCATION[1]="/kernel/drivers/misc"
DEST_MODULE_LOCATION[2]="/kernel/drivers/misc"

# kernel-7.x-api-port.patch targets the 6.13+ driver APIs.
BUILD_EXCLUSIVE_KERNEL="^(6\.(1[3-9]|[2-9][0-9])|[7-9]|[1-9][0-9])\."
