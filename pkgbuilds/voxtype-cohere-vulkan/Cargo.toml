[package]
name = "voxtype-cohere-vulkan"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["vulkan"] }

[profile.release]
debug = 0
