# Surface Laptop 7 15": hide the infrared sensor from camera pickers. It is
# monochrome and only useful with its emitter, not as a general camera.
# The front camera remains, provided through libcamera. The rule names the
# sensor by its device tree path, so it does nothing on a tree without it.
monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@10" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
