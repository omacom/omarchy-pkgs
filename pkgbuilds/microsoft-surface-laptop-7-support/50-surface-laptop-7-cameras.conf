# Surface Laptop 7: show only the "Front Camera" webcam in camera pickers.
# - The infrared sensor (15") is monochrome and only useful with its emitter.
# - The front camera itself is relayed to the "Front Camera" loopback device by
#   v4l2-relayd@surface-laptop-7, which has to own it, so its libcamera entry
#   is hidden too.
# - The camera subsystem's raw nodes (qcom-camss, platform-acb7000.isp) are
#   not usable cameras.
# The libcamera rules name the sensors by their device tree paths, so they do
# nothing on a tree without them.
monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@10" }
      { api.libcamera.path = "/base/soc@0/cci@ac16000/i2c-bus@1/camera@36" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]

monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "platform-acb7000.isp" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
