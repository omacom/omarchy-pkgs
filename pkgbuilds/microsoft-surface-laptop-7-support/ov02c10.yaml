# OmniVision OV02C10 on libcamera's software ISP (the Surface Laptop 7's front
# camera). libcamera has no sensor properties for it, so it guessed the black
# level from the darkest pixels and the picture came out grey: give it the
# sensor's 64 at 10 bits (4096 in 16 bits). The identity colour matrix only
# turns on the colour stage, so that the Saturation control takes effect.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Adjust:
  - Agc:
...
