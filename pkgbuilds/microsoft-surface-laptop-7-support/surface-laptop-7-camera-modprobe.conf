# Surface Laptop 7: the front camera as a regular V4L2 webcam (/dev/video50),
# which v4l2-relayd@surface-laptop-7 fills from libcamera while an app has it
# open. exclusive_caps lets apps that list only capture devices see it.
options v4l2loopback video_nr=50 card_label="Front Camera" exclusive_caps=1 max_buffers=4
