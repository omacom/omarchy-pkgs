# Surface Laptop 7 front camera (OmniVision OV02C10), relayed from libcamera's
# simple pipeline and software ISP to the "Front Camera" loopback device, for
# apps that read V4L2 cameras only. 1080p is scaled to 720p, which averages out
# much of the software ISP's noise, and a 5-pixel median takes out the speckle
# left. Contrast and saturation make up for the untuned sensor's flat picture.
VIDEOSRC="libcamerasrc camera-name=/base/soc@0/cci@ac16000/i2c-bus@1/camera@36 contrast=1.25 saturation=1.4 ! video/x-raw,width=1920,height=1080 ! videoscale method=lanczos ! video/x-raw,width=1280,height=720 ! videoconvert ! video/x-raw,format=I420 ! videomedian filtersize=5 lum-only=false ! videoconvert"
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Front Camera"
