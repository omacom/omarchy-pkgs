# Relay the Surface Laptop 7 front camera, on both sizes only.
[Unit]
ConditionFirmware=|device-tree-compatible(microsoft,romulus13)
ConditionFirmware=|device-tree-compatible(microsoft,romulus15)
After=modprobe@v4l2loopback.service

[Service]
# libcamera's software ISP allocates its buffers from a DMA heap or udmabuf,
# which the relay's sandbox doesn't list, and libcamera runs threads of its
# own, which LimitNPROC=1 refuses.
DeviceAllow=char-dma_heap rw
DeviceAllow=/dev/udmabuf rw
LimitNPROC=infinity
ExecStartPre=-/usr/lib/microsoft-surface-laptop-7-support/surface-laptop-7-camera-gain 2048
