<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74E4AE"/>
      <stop offset="0.5" stop-color="#46A9A0"/>
      <stop offset="1" stop-color="#245679"/>
    </linearGradient>
    <!-- A soft shadow to the left, so each card stands clear of the one behind. -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="6" stdDeviation="14" flood-color="#0B3340" flood-opacity="0.22"/>
    </filter>
    <rect id="card" width="356" height="320" rx="64"/>
    <!-- Each ghost is hidden where the card in front of it lies. -->
    <mask id="behind-middle" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#card" x="334" y="352" fill="#000"/>
    </mask>
    <mask id="behind-front" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#card" x="452" y="352" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) skewX(-12) translate(-512 -512)" fill="#fff">
    <use href="#card" x="216" y="352" fill-opacity="0.3" mask="url(#behind-middle)"/>
    <use href="#card" x="334" y="352" fill-opacity="0.6" mask="url(#behind-front)" filter="url(#lift)"/>
    <use href="#card" x="452" y="352" filter="url(#lift)"/>
  </g>
</svg>
