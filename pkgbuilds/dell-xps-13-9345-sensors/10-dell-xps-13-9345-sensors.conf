# Read the XPS 13 9345 light sensor through the patched libssc, after the
# sensor service when both start together. Ordering only: iio-sensor-proxy
# never waits for a sensor service that cannot start.
[Unit]
After=dell-xps-13-9345-sensors.service

[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/dell-xps-13-9345-sensors
Restart=always
RestartSec=2
TimeoutStopSec=10s
