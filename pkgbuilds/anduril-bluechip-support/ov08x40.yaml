# OmniVision OV08X40 on libcamera's software ISP (Anduril BlueChip front
# camera). libcamera has no sensor properties for it, so give it the sensor's
# 10-bit black level of 64 (4096 in 16 bits). The identity colour matrix turns
# on the colour stage so that Saturation takes effect.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Adjust:
  - Agc:
...
