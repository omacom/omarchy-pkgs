# Anduril BlueChip: the front camera as a regular V4L2 webcam (/dev/video50),
# which Omarchy's userland camera relay fills from libcamera while an app has it open.
# exclusive_caps lets apps that list only capture devices see it.
options v4l2loopback video_nr=50 card_label="Front Camera" exclusive_caps=1 max_buffers=4
