# Anduril BlueChip: show only the "Front Camera" loopback webcam in camera pickers.
# - The OV08X40 front camera is relayed to the "Front Camera" loopback device by
#   Omarchy's userland camera relay, which has to own it, so its libcamera entry is hidden.
# - The camera subsystem's raw nodes (qcom-camss, platform-acb6000.isp) are not
#   usable cameras.
monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.path = "/base/soc@0/cci@ac16000/i2c-bus@1/camera@10" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]

monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "platform-acb6000.isp" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
