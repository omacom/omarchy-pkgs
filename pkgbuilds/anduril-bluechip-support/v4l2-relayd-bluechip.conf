# Anduril BlueChip front camera (OmniVision OV08X40), relayed from
# libcamera's simple pipeline and Adreno X2-90 GPU software ISP to the
# "Front Camera" loopback device (/dev/video50) for V4L2 and PipeWire apps.
VIDEOSRC="libcamerasrc camera-name=/base/soc@0/cci@ac16000/i2c-bus@1/camera@10 gamma=1.5 contrast=1.05 saturation=1.4 ! video/x-raw,width=1920,height=1080 ! videoconvert n-threads=4"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Front Camera"
