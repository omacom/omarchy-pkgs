# Read the Surface Pro 11 light sensor through the patched libssc, after the
# sensor service when both start together. Ordering only: iio-sensor-proxy
# never waits for a sensor service that cannot start.
[Unit]
After=surface-pro-11-sensors.service

[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/surface-pro-11-sensors
Restart=always
RestartSec=2
TimeoutStopSec=10s
