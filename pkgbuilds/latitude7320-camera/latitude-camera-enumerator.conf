# The stock monitor's 64 slots are consumed by the IPU6 raw nodes.
# Use the matching 1.6.8 monitor with 128 slots; all video source code stays stock.
override.context.spa-libs = {
  api.v4l2.enum.udev = latitude-camera/libspa-latitude-camera-enum
  api.alsa.* = alsa/libspa-alsa
  api.bluez5.* = bluez5/libspa-bluez5
  api.v4l2.* = v4l2/libspa-v4l2
  api.libcamera.* = libcamera/libspa-libcamera
  audio.convert.* = audioconvert/libspa-audioconvert
  support.* = support/libspa-support
}
