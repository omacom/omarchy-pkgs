# The Zenbook 14 UX3480QA's speaker volume is two WSA884x "PA Volume" controls,
# merged by UCM into "Speakers Volume" and used by PipeWire as the hardware
# volume. They do not change the output on this board (measured within 0.04 dB
# across PA 1..6, with the compander on and off), so the part of the volume
# range they cover did nothing: roughly the top 30% with the upstream 0 dB PA
# ceiling. Use software volume instead.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-Zenbook14UX3480QA-1.0-UX3480QA" }
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-Zenbook14UX3480QAB-1.0-UX3480QAB" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
