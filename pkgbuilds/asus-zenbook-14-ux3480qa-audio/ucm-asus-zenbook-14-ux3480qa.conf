Syntax 6

# ASUS Zenbook 14 (UX3480QA / UX3480QAB): the ThinkPad T14s profile that
# alsa-ucm-conf gives the Zenbook A14, plus a FixedBootSequence for the WSA
# digital volumes.
#
# The WSA macro init sequence only runs in a BootSequence (when the card has no
# saved state) and uses unprefixed control names; a level saved under an older,
# lower kernel ceiling (-3 dB / 81) would otherwise stick, and with software
# volume nothing else moves them. "100%" is the kernel's ceiling: 84 (0 dB)
# with linux-omarchy-aarch64's raised limit, 81 (-3 dB) without it, where a
# literal 84 would be rejected.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/T14s-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.led.File "/common/ctl/led.conf"
Macro [
	{ CtlNew { Arg="name='Mic LED Capture Switch' type=bool,count=1 off" } }
	{ SetLED { LED="mic" Action="attach" CtlId="Mic LED Capture Switch" } }
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"

FixedBootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 100%"
	cset "name='WSA WSA_RX1 Digital Volume' 100%"
]
