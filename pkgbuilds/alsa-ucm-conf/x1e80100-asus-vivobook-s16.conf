
# 2x WSA Speakers | 2x Microphones | 3x DP/HDMI | 1x WCD Headset. The ASUS
# Vivobook S 16 S3607QA is wired as the Vivobook S 15 and the Zenbook A14,
# matched by its board vendor, family and board name
If.ASUSVivobookS16 {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "ASUSTeK COMPUTER.*-ASUS Vivobook S 16-S3607QA"
	}
	True.Include.vivobooks16.File "/Qualcomm/x1e80100/LENOVO-T14s.conf"
}
