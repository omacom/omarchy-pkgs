# 2x WSA Speakers | 2x Microphones | 2x DP/HDMI | 1x WCD Headset: the
# Samsung Galaxy Book4 Edge 14 (NP940XMA, NP944XMA), by its board vendor,
# family and board name. The 16-inch NP960XMA shares the family and is left out.
If.SamsungGalaxyBook4Edge14 {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "SAMSUNG ELECTRONICS.*-Galaxy Book4 Edge-NP94[04]XMA.*"
	}
	True.Include.galaxybook4edge14.File "/Qualcomm/x1e80100/Samsung-GalaxyBook4Edge.conf"
}
