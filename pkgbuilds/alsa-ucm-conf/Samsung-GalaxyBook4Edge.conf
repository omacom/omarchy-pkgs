# By Nicola Nicodemo, from github.com/n1c0la84/book4-edge-linux at ebf70f87f422.

# Samsung Galaxy Book4 Edge 14" (NP940XMA) with the Anatase device tree.
# Derived from alsa-ucm-conf ucm2/Qualcomm/x1e80100/X1E80100-CRD.conf (BSD-3-Clause).
#
# WSA883x speaker amplifiers: woofers SpkrLeft/SpkrRight (one per WSA macro,
# SoundWire address 2) and tweeters TweeterLeft/TweeterRight (address 1), all
# named by side since dts/patches/0005 (10 Oct; older DTBs had the woofer
# names swapped, with this profile only their balance is mirrored).
# WCD938x headset, 2x DMIC.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Samsung-GalaxyBook4Edge-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"

# "Speakers Volume": the woofers, in PCM channel order (FL = SpkrLeft). The
# tweeters' PA is set in the HiFi Speaker sequence (an If around a remap is
# evaluated before the card's controls are visible, so it cannot depend on
# them). Under the kernel's cap (0-6) the PA control is a flat -3 dB anyway;
# PipeWire does the volume in software.
LibraryConfig.remap.Config.ctl.default.map {
	"name='Speakers Volume'" {
		"name='SpkrLeft PA Volume'".vindex.0 0
		"name='SpkrRight PA Volume'".vindex.1 0
	}
}
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/four-speakers/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
