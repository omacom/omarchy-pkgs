
# 2x WSA Speakers | 2x Microphones | 2x DP/HDMI | 1x WCD Headset: the ThinkPad
# T14s's profile without its third DisplayPort output, which the Surface
# Laptop 7's sound card doesn't have
If.SURFACELaptop7 {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "Microsoft Corporation.*Surface.*Microsoft Surface Laptop, 7th Edition"
	}
	True.Include.sl7.File "/Qualcomm/x1e80100/MICROSOFT-Surface-Laptop-7.conf"
}
