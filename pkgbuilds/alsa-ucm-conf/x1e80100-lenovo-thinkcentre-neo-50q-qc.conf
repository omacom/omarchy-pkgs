
# 0x WSA Speakers | 0x Microphones | 3x DP/HDMI | 1x WCD Headset: the Lenovo
# ThinkCentre neo 50q QC, wired as the IdeaCentre Mini, whose device tree and
# sound card it shares, matched by its board vendor, family and board name
If.LENOVOThinkCentreNeo50qQC {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "LENOVO-ThinkCentre neo 50q QC-.*"
	}
	True.Include.neo50qqc.File "/Qualcomm/x1e80100/LENOVO-IdeaCentre-mini.conf"
}
