
# 2x WSA Speakers | 2x Microphones: the Surface Pro 12-inch's, whose card name
# the Surface Laptop 13-inch's device tree gives its card
If.SURFACELaptop13 {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "Microsoft Corporation.*Surface.*Surface Laptop 13in"
	}
	True.Include.sl13.File "/Qualcomm/x1e80100/MICROSOFT-Surface-Pro-12in.conf"
}
