
# 2x WSA Speakers | 2x Microphones | 3x DP/HDMI | 1x WCD Headset: the Acer
# Aspire 16 AI, by its board vendor, family and board name
If.AcerAspire16AI {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "SX1-Aspire 16 AI-Venue_SX1"
	}
	True.Include.aspire16ai.File "/Qualcomm/x1e80100/ACER-Aspire-16-AI.conf"
}
