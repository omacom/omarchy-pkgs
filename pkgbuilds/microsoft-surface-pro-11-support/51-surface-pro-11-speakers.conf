# Surface Pro 11: the speakers are meant to be used through the
# "Internal speakers" filter chain (50-surface-pro-11-speakers.conf in
# pipewire.conf.d), which carries the speaker EQ and the per-band limiter
# that stands in for Windows' speaker protection. The raw hardware sink is
# hidden the way WirePlumber hides the hardware node under a split PCM:
# media class Audio/Sink/Internal keeps it linkable for the chain but out of
# the sink lists and default selection. It is still reachable by name for
# debugging, e.g. pw-play --target alsa_output.platform-sound.HiFi__Speaker__sink.
#
# The chain's limiters set the speakers' ceiling, so the raw sink has to run
# at unity gain behind them. Being hidden, it can't be turned up, and it would
# otherwise start at WirePlumber's default route volume (0.4, about -24 dB), so
# a fresh install played at a fraction of Windows' loudness. This card's other
# outputs are the USB-C DisplayPort sinks, whose loudness the monitor sets.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 1.0
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Internal speakers (raw, no limiter)"
        media.class = "Audio/Sink/Internal"
        priority.session = 500
      }
    }
  }
]
