# SPDX-License-Identifier: CC0-1.0
# OmniVision OV02C10 on libcamera's software ISP (ASUS Zenbook A16 UX3607OA
# front camera). libcamera has no sensor properties for it, so it guesses the
# black level from the darkest pixels and the picture comes out grey: give it
# the sensor's 64 at 10 bits (4096 in 16 bits). The identity colour matrix
# turns on the colour stage so that the Saturation control takes effect.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Adjust:
  - Agc:
...
