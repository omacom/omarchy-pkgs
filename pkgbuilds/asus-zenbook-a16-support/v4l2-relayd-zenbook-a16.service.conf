# Relay the ASUS Zenbook A16 (UX3607OA) front camera on that board only.
[Unit]
ConditionFirmware=|device-tree-compatible(asus,zenbook-a16-ux3607oa)
After=modprobe@v4l2loopback.service

[Service]
# Load the package's sensor tuning files from a private directory so they never
# collide with other board packages or future upstream libcamera tuning files.
Environment=LIBCAMERA_IPA_CONFIG_PATH=/usr/share/asus-zenbook-a16-support/libcamera/ipa
# libcamera's software ISP allocates its buffers from a DMA heap or udmabuf,
# which the relay's sandbox doesn't list, and libcamera runs threads of its
# own, which LimitNPROC=1 refuses.
DeviceAllow=char-dma_heap rw
DeviceAllow=/dev/udmabuf rw
LimitNPROC=infinity
ExecStartPre=-/usr/lib/asus-zenbook-a16-support/zenbook-a16-camera-gain 2048
