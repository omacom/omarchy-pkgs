# ASUS Zenbook A16 (UX3607OA): show only the "Front Camera" webcam in camera pickers.
# - The HM1092 infrared sensor is monochrome and only useful with its emitter.
# - The OV02C10 front camera is relayed to the "Front Camera" loopback device by
#   v4l2-relayd@zenbook-a16, which has to own it, so its libcamera entry is
#   hidden too.
# - The camera subsystem's raw nodes (qcom-camss, platform-acb6000.isp) are
#   not usable cameras.
# The libcamera rules match the sensors by their device tree paths, so they do
# nothing on boards without them. The v4l2 rule hides raw CAMSS capture nodes
# on any Glymur board whose ISP sits at acb6000, where raw V4L2 nodes are never
# directly usable as webcams.
monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@24" }
      { api.libcamera.path = "/base/soc@0/cci@ac16000/i2c-bus@1/camera@36" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]

monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "platform-acb6000.isp" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
