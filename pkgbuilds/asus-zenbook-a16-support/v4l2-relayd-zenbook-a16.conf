# ASUS Zenbook A16 (UX3607OA) front camera (OmniVision OV02C10), relayed from
# libcamera's simple pipeline and Adreno X2-90 GPU software ISP to the
# "Front Camera" loopback device for apps that read V4L2 cameras only.
# Runs at native 1080p NV12 with multi-threaded videoconvert (skipping CPU
# videoscale/videomedian) to hold ~30 fps without stalling on CMA DMA-buf reads.
VIDEOSRC="libcamerasrc camera-name=/base/soc@0/cci@ac16000/i2c-bus@1/camera@36 contrast=1.25 saturation=1.4 ! video/x-raw,width=1920,height=1080 ! videoconvert n-threads=4"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Front Camera"
