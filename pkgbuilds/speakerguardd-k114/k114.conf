# MacBook Pro 14-inch (M5 Max, K114c): SN012776 amps with voltage and current sense, six speakers
# (woofers and tweeters). The thermal constants, the coil resistance and the coil temperature limits
# are the speaker/amplifier pair's own: vendor profile data read from the owner's own machine, the
# same kind of data as conf/apple/j700.conf. All six speakers share one thermal block in that data,
# so woofers and tweeters carry the same numbers here. Not measured on this Mac by us.
# Not covered by that data and left as before: vs_scale (the sense path's volts at full scale),
# and the 1 s / 60 s power budgets (the vendor profile sets none, so none are set here).
# speakerguardd uses the VSENSE words of sense PCM 2 (vs_chan) for power; it does not use ISENSE,
# is_chan, z_shunt or a_t_*.
# period: the sense PCM caps one period at 65520 bytes (2730 frames of 12 channels at S16), so not 4096.
[Globals]
sense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 2048
sense_format = S16_LE
t_reduction_max = 36.0

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left Woofer 1]
group = 1
tr_coil = 35.0
tau_coil = 3.2
tr_magnet = 55.0
tau_magnet = 225.0
t_limit = 135.0
t_headroom = 15.0
z_nominal = 3.90
vs_scale = 14
vs_chan = 1

