# MacBook Pro 14-inch (M5 Max, K114c): SN012776 amps with voltage and current sense, six speakers
# (woofers and tweeters). PROVISIONAL and NOT MEASURED: every constant is copied from the
# provisional speakersafetyd k114.conf, itself a j414 copy with a 100 C temperature limit.
# Open item: replace with constants measured on this Mac. speakerguardd uses the VSENSE words of sense
# PCM 2 (vs_chan) for power; it does not use ISENSE, is_chan, z_shunt or a_t_*.
# period: the sense PCM caps one period at 65520 bytes (2730 frames of 12 channels at S16), so not 4096.
[Globals]
sense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 2048
sense_format = S16_LE

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left Woofer 1]
group = 1
tr_coil = 28.09
tau_coil = 3.05
tr_magnet = 34.43
tau_magnet = 192.45
t_limit = 100.0
t_headroom = 10.0
z_nominal = 3.20
vs_scale = 14
vs_chan = 1

