# SPDX-License-Identifier: CC0-1.0
#
# Tuning file for OmniVision OV05C10 as fitted to the HP EliteBook X G2i.
# Used by the libcamera "simple" pipeline handler's software ISP (IPA "simple").
#
# INSTALL: /etc/libcamera/ipa/simple/ov05c10.yaml
#   libcamera derives the filename from the sensor model reported by the kernel
#   driver ("ov05c10"), see src/libcamera/pipeline/simple/simple.cpp:
#       ipa_->configurationFile(sensor->model() + ".yaml", "uncalibrated.yaml");
#   With this file absent you get uncalibrated.yaml, which has no CCM at all.
#
#   /etc and not /usr/share, because two libcameras have to find it. IPA_CONFIG_DIR
#   is built in src/ipa/meson.build as sysconfdir first, then datadir, and both
#   builds on this machine put /etc/libcamera/ipa at the front:
#       Arch libcamera 0.7.2  "/etc/libcamera/ipa:/usr/share/libcamera/ipa"
#       libcamera-ov05c10     "/etc/libcamera/ipa:/usr/lib/libcamera-ov05c10/share/libcamera/ipa"
#   (read back with strings(1) from the shipped .so, not inferred). A copy under
#   /usr/share/libcamera/ipa/simple only ever reaches the Arch build, and is
#   shadowed by this one if both exist.
#
# SCHEMA NOTES — verified against libcamera v0.7.2 source, not guessed:
#
#   * Algorithms run in the order listed. Ccm must come after Awb, because
#     Ccm::prepare() reads context.activeState.awb.temperatureK to pick which
#     matrix to interpolate to (src/ipa/simple/algorithms/ccm.cpp).
#
#   * BlackLevel takes ONE scalar key, "blackLevel", in 16-bit units.
#     src/ipa/simple/algorithms/blc.cpp:
#         auto blackLevel = tuningData["blackLevel"].get<int16_t>();
#         definedLevel_ = blackLevel.value() >> 8;
#     The per-channel "r:/gr:/gb:/b:" form used by the (unowned, locally placed)
#     /usr/share/libcamera/ipa/simple/ov08x40.yaml on this machine is NOT parsed
#     by 0.7.2 and is silently ignored. Do not copy that form.
#
#   * Ccm takes a list "ccms" of { ct, ccm } entries. ccm is nine floats,
#     ROW-MAJOR 3x3. src/ipa/simple/algorithms/ccm.cpp:
#         ccm_.readYaml(tuningData["ccms"], "ct", "ccm");
#     Entries are interpolated by correlated colour temperature; the matrix only
#     changes when the estimated CT moves by >= 100 K. A single entry is legal
#     and is used at every CT.
#
#   * Awb, Agc and Adjust have no tuning keys in 0.7.2 (their init() ignores
#     tuningData). Gamma, Contrast and Saturation are runtime controls with
#     built-in defaults. Saturation is only exposed when a CCM is present, so
#     shipping this file also unlocks the Saturation control.
#
#   * The CCM is applied by the GPU debayer too, not just the CPU one:
#     debayer_egl.cpp does
#         glUniformMatrix3fv(ccmUniformDataIn_, 1, GL_TRUE,
#                            params.combinedMatrix.data().data());
#     GL_TRUE = transpose on upload, i.e. it expects the row-major data written
#     here. So this file works on the GPU path as well as the CPU fallback.

%YAML 1.1
---
version: 1
algorithms:
  # ---------------------------------------------------------------------------
  # Black level.
  #
  # UNVERIFIED. 4096 is 64 in 10-bit units (64 << 6), the usual OmniVision
  # optical-black pedestal, and matches what the local ov08x40 file was reaching
  # for. The ov05c10 kernel driver (/usr/src/ov05c10-1.1.0/src/ov05c10.c) does
  # not define a black level, so this is inference, not datasheet.
  #
  # TO VERIFY: cover the lens completely, capture, and read the mean raw value.
  # If it is not 64/1023, change this to <measured 10-bit value> * 64.
  # TO DISABLE: comment out the blackLevel line. BlackLevel then estimates the
  # pedestal from the luma histogram each time exposure or gain changes, which
  # is what the known-good 2026-08-06 capture ran with. Prefer the estimator if
  # the fixed value makes shadows crushed or milky.
  - BlackLevel:
      blackLevel: 4096

  - Awb:
  # ---------------------------------------------------------------------------
  # Lens shading correction, from HP's factory tuning.
  #
  # PROVENANCE: generated by gen_lsc.py from
  #   ov05c10_CJFPE50_PTL.aiqb, LCMC group, DFLT mode,
  #   record cmc_name_id_lens_shading_correction_4x4 (28).
  # Unlike the colour matrices, this record IS per-module calibration: it
  # differs in 146564 of 189704 bytes between the CJFPE50 and CBG502N3
  # variants. These tables are the CJFPE50 ones, which is this machine. A
  # different unit needs its own extraction.
  #
  # The native record is a 63x47 grid of four Bayer channels
  # (Gr, R, B, Gb) in uint16 with 2048 == unity gain. Below it is resampled to
  # 33x25 and the two green channels are averaged, which is what a
  # demosaiced green pixel is. Resampling error, measured against the native
  # nodes: at most 0.009 in absolute gain on the colour field, 2.6% on the
  # luminance field.
  #
  # The gains are absolute correction factors over the sensor active area,
  # unity at the optical centre. The optical centre sits on the array centre:
  # the minimum of every plane is exactly 2048 at grid node (31, 23) of 63x47.
  #
  # ---------------------------------------------------------------------------
  # luminanceStrength -- THE ONE KNOB HERE. What to set it to, what it costs.
  #
  # It selects how much of the lens's brightness falloff (vignetting) to undo.
  # The colour correction is always applied in full, at every setting.
  #
  #   0.0  (SHIPPED DEFAULT) Correct colour shading only. Green is held at
  #        unity everywhere, red and blue are corrected relative to it. This
  #        removes the colour cast towards the edges of the frame and costs
  #        essentially nothing: the largest gain anywhere is 1.17x.
  #
  #   1.0  Also undo the vignetting, applying HP's tables exactly as measured.
  #        The corners get up to 8.65x brighter.
  #
  # Change it to 1.0 if a bright centre fading to dark corners bothers you more
  # than the two things it costs:
  #
  #   NOISE       The corner gain multiplies corner noise by the same factor.
  #               This pipeline has no denoise stage anywhere, so at 1.0 the
  #               corners get up to 8.65x noisier. HP's own ISP applies these
  #               tables alongside its denoise; this one cannot.
  #   HIGHLIGHTS  Anything in a corner brighter than the figure below clips.
  #
  #     strength   max gain   corner highlights clip above
  #       0.00       1.17x      85.1% of the range
  #       0.25       1.90x      52.7%
  #       0.50       3.15x      31.8%
  #       0.75       5.22x      19.2%
  #       1.00       8.65x      11.6%
  #
  # Intermediate values raise the luminance part of the gain to that power, so
  # 0.5 removes about half the falloff in stops. For flatter corners without
  # much noise cost, 0.25 to 0.5 is the useful range. 1.0 is correct in the
  # colorimetric sense and is what a measuring instrument would want.
  #
  # Changing this needs no regeneration: the tables below are HP's data
  # unmodified, and the IPA derives both parts from them at load time.
  # ---------------------------------------------------------------------------
  # Lens shading correction, from HP's factory tuning.
  #
  # PROVENANCE: generated by gen_lsc.py from
  #   ov05c10_CJFPE50_PTL.aiqb, LCMC group, DFLT mode,
  #   record cmc_name_id_lens_shading_correction_4x4 (28).
  # Unlike the colour matrices, this record IS per-module calibration: it
  # differs in 146564 of 189704 bytes between the CJFPE50 and CBG502N3
  # variants. These tables are the CJFPE50 ones, which is this machine. A
  # different unit needs its own extraction.
  #
  # The native record is a 63x47 grid of four Bayer channels
  # (Gr, R, B, Gb) in uint16 with 2048 == unity gain. Below it is resampled to
  # 33x25 and the two green channels are averaged, which is what a
  # demosaiced green pixel is. Resampling error, measured against the native
  # nodes: at most 0.009 in absolute gain on the colour field, 2.6% on the
  # luminance field.
  #
  # The gains are absolute correction factors over the sensor active area,
  # unity at the optical centre. The optical centre sits on the array centre:
  # the minimum of every plane is exactly 2048 at grid node (31, 23) of 63x47.
  #
  # ---------------------------------------------------------------------------
  # THE TWO KNOBS. Read this before changing either.
  #
  # A flat field was captured on this machine and measured against these
  # tables (16 frames, white wall, soft indoor light). The result split the
  # two components apart:
  #
  #   LUMINANCE  matches. The measured falloff tracks these tables to within
  #              1-3% across the frame. This part is validated.
  #   COLOUR     does not match under that light. The tables predicted red
  #              falling off 10-12% more than green; the measurement showed
  #              3.7%. The SHAPE is right (correlation 0.92 against the F2
  #              table) but the AMPLITUDE depends on the illuminant's
  #              spectrum, and HP calibrated no LED source. See below.
  #
  # colourStrength: 0.0 .. 1.0, default 1.0 in code, SET TO 0.0 HERE.
  #
  #   How much of the colour shading to undo. It is set to 0.0 because of the
  #   measurement above. Selecting the table by colour temperature picks D50 or
  #   D65 under white LED light, and those are the two tables with the largest
  #   colour shading of the eight, so the correction over-corrects red by about
  #   6x and makes the corner colour error WORSE: +3.7% uncorrected becomes
  #   +8.2% corrected. Leaving it at 0.0 is the do-no-harm setting.
  #
  #   Raise it only with a measurement to back the value. Under a light with a
  #   continuous red tail (incandescent, halogen, real daylight) these tables
  #   are expected to be right and 1.0 should be correct; under LED or
  #   fluorescent the effect is much smaller than the CT-selected table thinks.
  #
  # luminanceStrength: 0.0 .. 1.0, default 0.0.
  #
  #   How much of the lens's brightness falloff (vignetting) to undo. This is
  #   the validated component. It is still 0.0 by default because undoing the
  #   falloff has a real cost:
  #
  #   NOISE       The corner gain multiplies corner noise by the same factor.
  #               This pipeline has no denoise stage anywhere, so at 1.0 the
  #               corners get up to 8.65x noisier. HP's own ISP applies these
  #               tables alongside its denoise; this one cannot.
  #   HIGHLIGHTS  Anything in a corner brighter than the figure below clips.
  #
  #     strength   max gain   corner highlights clip above
  #       0.00       1.00x     no clipping
  #       0.25       1.66x      60.3% of the range
  #       0.50       2.75x      36.4%
  #       0.75       4.56x      21.9%
  #       1.00       7.56x      13.2%
  #
  #   (those are with colourStrength 0. With colourStrength 1 the largest gain
  #   is 1.17x at luminanceStrength 0, and 8.65x at 1.0.)
  #
  #   Set it to 1.0 if a bright centre fading to dark corners bothers you more
  #   than the noise; 0.25 to 0.5 is the useful middle ground.
  #
  # With both at 0.0 this block is inert: the algorithm loads, logs what it
  # loaded, and applies unity gain everywhere. That is deliberate, and it is
  # the state the measurement supports until a second flat field under
  # incandescent light settles whether the colour tables are right.
  #
  # Changing either knob needs no regeneration: the tables below are HP's data
  # unmodified, and the IPA derives both components from them at load time.
  - Lsc:
      luminanceStrength: 0.0
      colourStrength: 0.0
      gridWidth: 33
      gridHeight: 25
