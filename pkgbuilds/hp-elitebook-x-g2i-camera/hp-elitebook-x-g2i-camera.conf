# /etc/hp-elitebook-x-g2i-camera.conf
#
# Machine-local configuration for hp-elitebook-x-g2i-camera.service, read as
# a systemd EnvironmentFile (KEY=VALUE lines, # comments; no shell syntax).
# Applied on the next `systemctl restart hp-elitebook-x-g2i-camera`.

# Which engine produces frames while an application uses the camera.
#   camhal  (default) Intel's hardware ISP via the pinned runtime in
#           /usr/lib/hp-elitebook-x-g2i-camhal. Falls back to softisp for the
#           rest of the boot after two consecutive failures.
#   softisp libcamera's software ISP (the 1.x path). Setting either value
#           explicitly disables the automatic fallback machinery: an explicit
#           camhal keeps retrying camhal forever.
#HPCAM_ENGINE=camhal

# ISP noise-reduction strength for the camhal engine, on the HAL's own preset
# scale: 0 = HAL default (LEVEL2), -60 = LEVEL3, -120 = LEVEL4. Measured on
# this machine 2026-08-30: -60 cuts within-frame dark-scene noise ~28%, -120
# ~45% with no visible detail smearing. Shipped default is -120: it passed the
# 2026-08-31 daylight check with sharpness identical to -60 (4.73 vs 4.77).
HPCAM_NR_STRENGTH=-120

# GPU temporal denoise for the camhal engine. Float, 0 to 64, default 8.
# Runs on the Intel GPU's VEBOX block (vapostproc), so it costs almost no CPU.
# It is motion-adaptive and temporal: the right tool for the residual noise
# this ISP leaves, which is temporally white 4-16px blobs. 0 removes the
# filter from the pipeline entirely; the pipeline is then identical to 2.0.1.
# Higher values smooth more and can ghost fast motion.
#HPCAM_DENOISE=8

# Optional AE clamps for the camhal engine. Format: min~max, digits and dots
# only. Passed to icamerasrc as exposure-time-range / gain-range. Unset means
# the HAL's own AE limits. Invalid values are ignored with a journal line.
#
# Measured on this machine: AE pins exposure at 33ms (the 30fps cap) and then
# rides 12.5-15.5x analog gain, even in daylight. Raising the exposure ceiling
# lets AE trade that gain for exposure time. Note: exposures longer than 33ms
# reduce effective fps below 30 and add motion blur.
#
# HPCAM_EXPOSURE_RANGE is in microseconds. HPCAM_GAIN_RANGE caps analog gain;
# with exposure pinned at its ceiling, lowering only the gain cap darkens the
# image instead of cleaning it.
#HPCAM_EXPOSURE_RANGE=100~50000
#HPCAM_GAIN_RANGE=1~10

# Local AIQ tuning override for the camhal engine. If this file exists it
# replaces the packaged OV05C10_CJFPE50_PTL.aiqb at every sensor start (no
# service restart needed). Intended for the Windows-extracted HP tuning, which
# measures better NR but cannot be redistributed in a package.
#CAMHAL_AIQB_OVERRIDE=/etc/hp-elitebook-x-g2i/OV05C10_CJFPE50_PTL.aiqb

# Seconds without a consumer before the sensor (and privacy LED) turns off.
#IDLE_STOP=5

# SoftISP-engine tuning; see the daemon header in hpcam-lc.cpp for the rest.
#AE_TARGET=105
