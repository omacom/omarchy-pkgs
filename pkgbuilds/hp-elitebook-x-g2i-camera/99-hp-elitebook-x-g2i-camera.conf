# The IPU7 needs the USB-IO bridges, the vision-sensing controller and the
# INT3472 power/clock discrete up before it probes.
softdep intel_ipu7 pre: usbio gpio_usbio i2c_usbio intel_cvs intel_skl_int3472_discrete

# ov05c10 binds an I2C client that ipu-bridge creates while intel_ipu7 probes.
# Loading it first is not fatal -- it simply finds no device and does nothing --
# but then nothing loads it again, and the camera is absent until the next boot.
softdep ov05c10 pre: intel_ipu7
