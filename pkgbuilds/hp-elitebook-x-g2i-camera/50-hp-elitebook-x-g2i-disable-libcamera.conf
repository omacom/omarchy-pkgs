# Turn off WirePlumber's libcamera monitor on this machine.
#
# This is noise suppression, not function. The camera works either way, and that
# was measured rather than assumed: with this file removed and the libcamera SPA
# plugin confirmed loaded into the running WirePlumber, the graph still showed
# exactly one video device -- /dev/video50, through the v4l2 monitor -- and the
# camera was undisturbed.
#
# What it costs to leave the monitor on is 32 ERROR lines at every WirePlumber
# start, one per raw IPU7 ISYS node:
#
#   ERROR MediaDevice media_object.cpp:420 Device node /dev/video4 can't be
#   accessed: Permission denied
#
# Those nodes are root-only by design (71-ipu7-hide-isys.rules, from
# intel-ipu7-drivers), because a browser would otherwise list all 32 as cameras.
# libcamera walks the media graph, fails to open the capture node, and registers
# nothing -- which is the correct outcome, reached noisily. Thirty-two ERROR
# lines per restart is the kind of thing that hides a real fault, so it is worth
# one file to silence.
#
# Nothing here needs the libcamera monitor. The camera is published on a
# v4l2loopback device, so PipeWire and every application see V4L2.
wireplumber.profiles = {
  main = {
    "monitor.libcamera" = disabled
  }
}
