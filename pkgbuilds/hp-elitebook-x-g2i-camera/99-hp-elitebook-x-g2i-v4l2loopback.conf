# HP EliteBook X G2i webcam loopback.
#
# exclusive_caps=1 makes the device report CAPTURE-only while a writer is
# attached. This is REQUIRED for Chrome, which only enumerates V4L2 devices
# advertising capture WITHOUT output -- with 0 the device reports Capture+Output
# and Chrome silently omits it entirely (Firefox and OBS are unaffected).
#
# This is only correct because hp-elitebook-x-g2i-camera.service keeps a writer
# attached at ALL times. With no writer the device reports output-only and every
# reader fails with "VIDIOC_STREAMON: Input/output error". The service and this
# file are a matched pair -- do not disable one without the other.
options v4l2loopback devices=1 video_nr=50 card_label="HP EliteBook X G2i Webcam" exclusive_caps=1
