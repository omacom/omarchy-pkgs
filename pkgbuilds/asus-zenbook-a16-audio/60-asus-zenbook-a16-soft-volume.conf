# The Zenbook A16's speaker volume is four WSA884x "PA Volume" controls, merged
# by UCM and used by PipeWire as the hardware volume. They do not change the
# output on this board, so the part of the volume range they cover did nothing:
# above ~70% with the upstream 0 dB PA ceiling. Use software volume instead.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
