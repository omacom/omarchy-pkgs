# Without ACP, WirePlumber's ALSA monitor names every PCM after the card's
# long name, so the shell shows four identical outputs. Give each front end
# the name of the port it drives.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA", api.alsa.pcm.device = "0" }
    ]
    actions = { update-props = { node.nick = "Speaker" } }
  }
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA", api.alsa.pcm.device = "1" }
    ]
    actions = { update-props = { node.nick = "Microphone" } }
  }
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA", api.alsa.pcm.device = "2" }
    ]
    actions = { update-props = { node.nick = "HDMI0 (USB-C)" } }
  }
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA", api.alsa.pcm.device = "3" }
    ]
    actions = { update-props = { node.nick = "HDMI1 (USB-C)" } }
  }
  {
    matches = [
      { api.alsa.card.longname = "ASUSTeKCOMPUTERINC.-ZenbookA16UX3607OA-1.0-UX3607OA", api.alsa.pcm.device = "6" }
    ]
    actions = { update-props = { node.nick = "HDMI2 (onboard)" } }
  }
]
