Syntax 4

# ASUS Zenbook A16 (UX3607OA): Qualcomm's Glymur CRD profile, whose wiring this
# board shares, plus a FixedBootSequence for the WSA digital volumes.
#
# The CRD profile sets them to 84 (0 dB) in a BootSequence, which only runs
# when the card has no saved state, and the speaker volume does not drive them
# (the board uses software volume, see the WirePlumber rule). A level saved
# under an older, lower kernel ceiling would otherwise stick, so set them on
# every boot. "100%" is the kernel's ceiling: 84 (0 dB) with the Zenbook's
# raised limit, 81 (-3 dB) without it, where a literal 84 would be rejected.

SectionUseCase."HiFi" {
	File "/Qualcomm/glymur/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/four-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/four-speakers/init.conf"

FixedBootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 100%"
	cset "name='WSA WSA_RX1 Digital Volume' 100%"
	cset "name='WSA2 WSA_RX0 Digital Volume' 100%"
	cset "name='WSA2 WSA_RX1 Digital Volume' 100%"
]
