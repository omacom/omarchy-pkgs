# Game launches can leave the J314 speaker DSP suspended with Start/EPERM.
# Keep both halves processing, using the existing Asahi DSP and protection.
# This matches the tested M1 Pro 14-inch model only; other outputs are unchanged.
node.rules = [
  {
    matches = [
      { node.name = "audio_effect.j314-convolver" }
      { node.name = "effect_output.j314-convolver" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.always-process = true
      }
    }
  }
]
