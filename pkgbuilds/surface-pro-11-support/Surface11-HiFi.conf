# Use case configuration for X1E80100, Surface Pro 11.
# Derived from alsa-ucm-conf's Qualcomm/x1e80100/Surface12in-HiFi.conf.
# Original author: Srinivas Kandagatla <srinivas.kandagatla@linaro.org>
# Surface Pro 11 changes: Brandon Williams <turbine.bmw@gmail.com>
#
# Surface Pro 11 microphone, user-validated speaker and USB-C DisplayPort
# profile. Control names follow the paired Denali AudioReach topology.

SectionVerb {
	EnableSequence [
		# PipeWire probes playback constraints before enabling Speaker. Keep
		# every physical route off and muted, then expose the PCM backend.
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0,0"
		cset "name='WSA WSA_RX0 Digital Mute' 1"
		cset "name='WSA WSA_RX1 Digital Mute' 1"
		cset "name='WSA WSA_RX0 Digital Volume' 84"
		cset "name='WSA WSA_RX1 Digital Volume' 84"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight PA Volume' 12"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='WSA WSA_RX0 INP0' ZERO"
		cset "name='WSA WSA_RX1 INP0' ZERO"
		cset "name='WSA WSA RX0 MUX' ZERO"
		cset "name='WSA WSA RX1 MUX' ZERO"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1,0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		# Like the speaker route above: PipeWire opens every PCM before it
		# enables a device, and a frontend without a backend refuses hw_params.
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0,0"
		cset "name='WSA WSA_RX0 Digital Mute' 1"
		cset "name='WSA WSA_RX1 Digital Mute' 1"
		cset "name='WSA WSA_RX0 Digital Volume' 0"
		cset "name='WSA WSA_RX1 Digital Volume' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	# Begin muted at the daily-use ceiling. Value 84 is 0 dB in the WSA
	# macro; PA value 12 is +9 dB (the upstream two-speaker profile values;
	# +12 dB over the earlier 81/6 setting, which was about half the Windows
	# loudness). The kernel machine driver clamps at exactly these values.
	# To back off: amixer -c 0 cset name='SpkrLeft PA Volume' 6 (and Right).
	# The backend connects last.
	# PipeWire uses software volume because no hardware PlaybackMixerElem is
	# declared, so the desktop slider attenuates below this fixed ceiling.
	EnableSequence [
		cset "name='WSA WSA_RX0 Digital Mute' 1"
		cset "name='WSA WSA_RX1 Digital Mute' 1"
		cset "name='WSA WSA_RX0 Digital Volume' 84"
		cset "name='WSA WSA_RX1 Digital Volume' 84"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight PA Volume' 12"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrRight WSA MODE' Speaker"
		cset "name='WSA WSA_RX0 INP0' RX0"
		cset "name='WSA WSA_RX1 INP0' RX1"
		cset "name='WSA WSA RX0 MUX' AIF1_PB"
		cset "name='WSA WSA RX1 MUX' AIF1_PB"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrLeft PBR Switch' 1"
		cset "name='SpkrRight PBR Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1,0"
		cset "name='WSA WSA_RX0 Digital Mute' 0"
		cset "name='WSA WSA_RX1 Digital Mute' 0"
	]

	# Disconnect upstream first, then mute and power down data ports. Retain
	# minimum digital and PA values as the inactive baseline.
	DisableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0,0"
		cset "name='WSA WSA_RX0 Digital Mute' 1"
		cset "name='WSA WSA_RX1 Digital Mute' 1"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrLeft PBR Switch' 0"
		cset "name='SpkrRight PBR Switch' 0"
		cset "name='WSA WSA_RX0 INP0' ZERO"
		cset "name='WSA WSA_RX1 INP0' ZERO"
		cset "name='WSA WSA RX0 MUX' ZERO"
		cset "name='WSA WSA RX1 MUX' ZERO"
		cset "name='WSA WSA_RX0 Digital Volume' 0"
		cset "name='WSA WSA_RX1 Digital Volume' 0"
		cset "name='SpkrLeft PA Volume' 0"
		cset "name='SpkrRight PA Volume' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# The generic VA-macro includes select the right routes but apply +16 dB
	# decimator gain. The 3.2 MHz clock probe produced a clean but quiet capture
	# at 0 dB (value 84), so retain 4 dB of headroom below the generic setting
	# and use +12 dB (value 96) for the working Denali profile.
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 96"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 96"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA_DEC0 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX1' ZERO"
		cset "name='VA_DEC1 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

# Each USB-C port has its own PCM, so a monitor or dock plays next to the
# speakers instead of replacing them, and the speaker chain stays off it.
# The devices exist only when the device tree links the DisplayPort codecs,
# which is when the kernel creates the jacks; without the links the PCMs
# cannot open and PipeWire would drop the whole HiFi profile.

If.dp0 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP0 Jack'"
	}
	True {
		SectionDevice."HDMI0" {
			Comment "USB-C DisplayPort 0 playback"

			EnableSequence [
				cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
			]

			DisableSequence [
				cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
			]

			Value {
				PlaybackChannels 2
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},2"
				JackControl "DP0 Jack"
			}
		}
	}
}

If.dp1 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP1 Jack'"
	}
	True {
		SectionDevice."HDMI1" {
			Comment "USB-C DisplayPort 1 playback"

			EnableSequence [
				cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
			]

			DisableSequence [
				cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 0"
			]

			Value {
				PlaybackChannels 2
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},3"
				JackControl "DP1 Jack"
			}
		}
	}
}
