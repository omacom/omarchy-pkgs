# Surface Pro 11: hide the infrared sensor from camera pickers. It is
# monochrome and only useful with its illuminator, not as a general camera.
# The front and back cameras remain, provided through libcamera.
monitor.libcamera.rules = [
  {
    matches = [
      { api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@60" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
