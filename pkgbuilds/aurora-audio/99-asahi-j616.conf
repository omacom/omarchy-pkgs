# J616s (MacBook Pro 16", M4 Pro, 2024) speakers. asahi-audio at this
# package's commit has no J616 speaker graph, so this adds the one from
# aurora-silicon/asahi-audio c9671411 (firs/j616/graph.json, installed as
# /usr/share/asahi-audio/j616/graph.json). It runs the J316 tuning: the J316
# FIRs, a woofer band compressor and limiter, and a tweeter peak limiter. The
# speaker protection is speakersafetyd's apple/j616.conf from this package.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ616,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j616/graph.json"
                hide-parent = true
            }
        }
    }
]

# The J616s headphone jack is its own card (MacBook Pro J616 Jack), so its
# sink does not get the port bonus the jack has on Macs where it shares the
# speaker card, and it ties DisplayPort audio at priority 1000. WirePlumber
# then keeps sound on an external display when headphones are plugged in.
# Rank the jack above DisplayPort; the speakers' DSP sink stays at 850.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "alsa_output.platform-sound-jack.HiFi__Headphones__sink" }
        ]
        actions = {
            update-props = {
                priority.session = 1100
            }
        }
    }
]
