# J616s (MacBook Pro 16", M4 Pro, 2024) speakers. asahi-audio at this
# package's commit has no J616 speaker graph, so this adds the one from
# aurora-silicon/asahi-audio c9671411 (firs/j616/graph.json, installed as
# /usr/share/asahi-audio/j616/graph.json). It runs the J316 tuning: the J316
# FIRs, a woofer band compressor and limiter, and a tweeter peak limiter. The
# speaker protection is speakersafetyd's apple/j616.conf from this package.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ616,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j616/graph.json"
                hide-parent = true
            }
        }
    }
]
