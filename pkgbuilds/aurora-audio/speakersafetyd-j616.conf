# MacBook Pro 16-inch M4 Pro and M4 Max (J616s, J616c).
#
# This is speakersafetyd's j316.conf (AsahiLinux/speakersafetyd 615674e7,
# the file speakersafetyd 2.0.1 ships) with the J616 sense layout. The J616
# drivers belong to the J316's speaker tuning family, so every model value
# below is j316.conf's, unchanged. Those are the values speakersafetyd runs
# on the J316 with its model, which works from measured V*I power. Newer
# macOS releases carry other constants for this family, made for macOS's
# own feed-forward model; they are not mixed in here.
#
# What differs is where each amp puts its V/I sense words. The J616 amps
# report in the order the machine lists them: left woofer 1, right woofer
# 1, left woofer 2, right woofer 2, left tweeter, right tweeter. Amp n
# sends its current on 16-bit channel 2n and its voltage on 2n+1 (the
# ti,imon-slot-no and ti,vmon-slot-no of t6040-j616s.dts, in 8-bit units).
# The J316 puts its tweeters before the second woofers. This is the same
# map Jonathan Goyvaerts tested amp by amp on his J616s, and each playback
# channel was checked to reach only its own section here.
#
# On our J616s, left woofer 1's current sense reads about half of what the
# other woofers' do at the same drive; its voltage reads the same, and our
# J316 shows no such difference. Group 1 shares one gain across the
# woofers, and the J616 speaker graph gives left woofer 2 the same signal,
# so the group stays limited by a woofer whose sense reads true.

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 23.00
tr_magnet = 40.00
tau_coil = 5.60
tau_magnet = 197.25
t_limit = 140.0
t_headroom = 10.0
z_nominal = 3.60
z_shunt = 0.09
a_t_20c = 0.00374895
a_t_35c = 0.00354903
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

