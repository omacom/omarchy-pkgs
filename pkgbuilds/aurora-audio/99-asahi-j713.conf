# J713 (MacBook Air 13", M4) microphones: the J413/J613 chassis and three
# microphone array, so asahi-audio's J413 beamformer graph under this board's
# name, as aurora-silicon/asahi-audio 62c639a does. It has no speaker rule:
# nothing this repository ships protects the J713's speakers.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ713HPAI,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j413/mic-j713.json"
                hide-parent = true
            }
        }
    }
]
