[Service]
# Match the non-login PATH in omarchy's pam_env.conf. %h is the service user's
# home. The default unit name is openclaw-gateway.service; a named profile unit
# does not pick up this drop-in.
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:%h/.local/share/mise/shims:%h/.local/bin
