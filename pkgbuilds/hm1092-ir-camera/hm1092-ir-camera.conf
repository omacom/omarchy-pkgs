# hm1092-relay settings (systemd EnvironmentFile syntax).

# Name of the grayscale V4L2 device the relay publishes. Howdy, the udev symlink
# /dev/video-hm1092-ir and the WirePlumber hide rule all look for this exact name.
CARD_LABEL="HM1092 IR Camera"

# Sensor mode to configure and republish. The HM1092 streams 648x368 binned.
WIDTH=648
HEIGHT=368

# Preferred loopback number; the next free one is used when it is taken.
VIDEO_NR=51

# 1 if faces come out upside down. The Dell sensor driver flips in hardware.
ROTATE180=0

# 1 for a plain 10-to-8 bit shift; 0 scales each burst so the brightest
# unsaturated percentile lands near 235, which dlib's detector prefers.
FIXED_SCALE=0

# IR flood LED directory under /sys/class/leds; empty takes the first *ir_flood_led*.
IR_LED=

# The flood LED is invisible near-infrared, so the blink reflex gives no
# protection. A consumer gets light for at most MAX_ILLUMINATION_MS after it
# first lights, then darkness until it lets go of the device. Across consumers,
# the LED is lit for at most DUTY_FRACTION (0 to 1) of any DUTY_WINDOW_S window.
# The relay refuses to start on a value that would void either limit.
MAX_ILLUMINATION_MS=8000
DUTY_WINDOW_S=60
DUTY_FRACTION=0.5
