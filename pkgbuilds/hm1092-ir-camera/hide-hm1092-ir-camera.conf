# Hide the HM1092 relay from PipeWire: it is an authentication sensor, not a
# webcam for browsers and calls. Howdy reads the V4L2 node directly.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.product.name = "HM1092 IR Camera"
      }
      {
        api.v4l2.cap.card = "HM1092 IR Camera"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
