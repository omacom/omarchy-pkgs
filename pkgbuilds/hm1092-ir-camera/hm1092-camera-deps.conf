# The HM1092 sits on the Synaptics SVP7500 bridge next to the RGB sensor, so it
# must bind only after intel_cvs has taken camera ownership, exactly like
# ov08x40 in intel-ipu7-camera's camera-deps.conf. hm1092-camera-init.service
# loads it once the RGB stack is up.
blacklist hm1092
softdep hm1092 pre: intel_cvs
