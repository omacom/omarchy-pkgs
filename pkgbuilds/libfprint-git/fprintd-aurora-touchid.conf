# fprintd's sandbox allows only the devices it names (DevicePolicy=auto with
# DeviceAllow=), and Arch's unit names USB, SPI, hidraw and /dev/cros_fp.
#
# The aurora driver talks to Touch ID through /dev/sep-bio, a misc device the
# linux-aurora Secure Enclave driver registers. systemd resolves the path when
# fprintd starts, which is when libfprint looks for readers too. This package
# owns the allowance; other packages should not repeat it.
#
# libfprint also hides a reader that a closed laptop lid covers, and follows
# the lid switch for that. This is a deliberate widening: char-input lets
# fprintd read every input device, keyboards included. libfprint opens only
# devices that udev reports as switches, read-only, and keeps those that
# report SW_LID. An allowance for the lid switch's path alone would be
# resolved only once, when fprintd starts: a switch whose driver
# (macsmc-input) loads later, or that comes back as a new node, would stay
# blocked while fprintd runs.
[Service]
DeviceAllow=/dev/sep-bio rw
DeviceAllow=char-input r
