monitor.alsa.rules = [
  {
    matches = [ { node.name = "~^alsa_output[.]platform-mtk_sdw_mc([.][0-9]+)?[.]HiFi__Speaker__sink$" } ]
    actions = { update-props = { media.class = "Audio/Sink/Internal" } }
  }
  {
    matches = [ { node.name = "~^alsa_output[.]platform-mtk_sdw_mc([.][0-9]+)?[.]HiFi__Headphones__sink$" } ]
    actions = { update-props = { media.class = "Audio/Sink/Internal" } }
  }
]
