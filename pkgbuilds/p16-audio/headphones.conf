context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { rtportal.enabled = false } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = "p16_headphones"
      node.description = "Auriculares P16"
      combine.props = { audio.position = [ FL FR ] priority.session = 0 priority.driver = 0 }
      stream.props = { stream.dont-remix = true node.dont-fallback = true node.dont-move = true }
      stream.rules = [ { matches = [ { media.class = "Audio/Sink/Internal"
        node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Headphones__sink" } ]
        actions = { create-stream = { combine.audio.position = [ FL FR ] audio.position = [ FL FR ] } } } ]
    }
  }
]
