# Surface Laptop 8 card profile, derived from alsa-ucm-conf's
# Qualcomm/glymur/GLYMUR-CRD.conf.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/surface-laptop8/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/Qualcomm/surface-laptop8/WSAInit.conf"
