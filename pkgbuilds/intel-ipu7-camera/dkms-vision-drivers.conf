# Legacy Intel CVS misc driver (no V4L2 bridge). Only for kernels before
# 7.2: from 7.2 on, ipu-bridge routes the sensor through a CVS V4L2 bridge
# sub-device, which this driver does not provide, and it would displace the
# in-tree intel_cvs module of the same name. 7.2+ kernels use intel-cvs
# (see dkms-intel-cvs.conf) instead.
PACKAGE_NAME="vision-drivers"
PACKAGE_VERSION="@PKGVER@"
AUTOINSTALL="yes"

# Before 7.2 only (regex, so the pacman dkms hook also honours it)
BUILD_EXCLUSIVE_KERNEL="^([0-6]\.|7\.[01]\.)"

BUILT_MODULE_NAME[0]="intel_cvs"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates"

MAKE[0]="make KERNEL_SRC=${kernel_source_dir}"
CLEAN="make KERNEL_SRC=${kernel_source_dir} clean"
