# fps-range and gain-range: in dim light AE may lengthen frames down to 15 fps
# and never raises gain past 27 dB, instead of holding 30 fps at ~48x gain.
# color-range=reduced: consumers decode NV12 webcam frames as limited range.
VIDEOSRC="icamerasrc device-name=ov08x40-uf fps-range=15~30 gain-range=0~27 color-range=reduced ! videoflip method=rotate-180"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Hardware ISP Camera"
