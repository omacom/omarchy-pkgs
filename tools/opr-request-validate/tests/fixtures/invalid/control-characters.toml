schema = 1

[package]
name = "ansi-tool"
# The escapes below are TOML escape sequences, so this fixture is pure ASCII on
# disk and still parses to real control characters. That is deliberate: the
# hazard is a value that renders as one thing and is stored as another, and a
# fixture full of invisible raw bytes would be unreviewable in a diff.
#
# U+001B ESC: renders as colour in a maintainer's terminal.
description = "Terminal \u001B[31mred\u001B[0m emulator\u200B"
upstream = "https://github.com/example/ansi-tool"
license = "MIT"
surface = "binary"
architectures = ["x86_64"]

[source]
kind = "release"

[requester]
relationship = "user"
# U+202E RIGHT-TO-LEFT OVERRIDE: reverses the display of everything after it.
notes = "Looks harmless\u202Ebut is not"
