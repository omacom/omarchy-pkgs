[package]
name = "opr-request-validate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Validates OPR packaging requests against the request schema. Offline by default."

[[bin]]
name = "opr-request-validate"
path = "src/main.rs"

[lib]
name = "opr_request_validate"
path = "src/lib.rs"

[dependencies]
# default-features = false is load-bearing: the defaults enable `reqwest`,
# `resolve-http` and `resolve-file`, which would link a remote $ref resolver
# into a binary whose entire purpose is to run with no network. Our schema is
# self-contained, so no resolver is needed.
jsonschema = { version = "0.53", default-features = false }
serde_json = "1.0"
spdx = "0.13"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
# Only ever constructed on the --resolve path. rustls, not native-tls, so the
# musl static target links cleanly.
url = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
